/* ============================================================
   Детали тренировки
   ============================================================ */
function renderWorkoutDetail(params) {
  const w = (state.workouts || []).find((x) => x.id === params.id);
  if (!w) {
    return {
      html: topbar({ title: 'Тренировка', back: 'go-back' }) + `<div class="view">${emptyState({ title: 'Не найдено', text: 'Тренировка удалена.' })}</div>`,
      mount() {},
    };
  }
  const groups = workoutGroups(w);
  const vol = workoutVolume(w);
  const sets = workoutSets(w);
  const dur = workoutDuration(w);
  const maxGroup = Math.max(1, ...groups.map((g) => g.sets));

  const body = `
    <div class="pad">
      <div class="card card--pad">
        <div class="row">
          <div class="grow">
            <div class="tiny">${fmtDateFull(w.date)}</div>
            <div class="h2" style="margin-top:2px">${escapeHtml(w.name)}</div>
          </div>
          ${w.programId ? `<span class="badge badge--accent">${icon('layers', 12)} программа</span>` : ''}
        </div>
        <div class="metrics" style="margin-top:14px">
          <div class="metric"><div class="metric__v">${fmtVolume(vol)}</div><div class="metric__l">Объём</div></div>
          <div class="metric"><div class="metric__v">${fmtMinutes(dur)}</div><div class="metric__l">Время</div></div>
          <div class="metric"><div class="metric__v">${sets}</div><div class="metric__l">Подходов</div></div>
        </div>
        <div class="metrics" style="margin-top:8px;grid-template-columns:repeat(2,1fr)">
          <div class="metric"><div class="metric__v">${w.items.length}</div><div class="metric__l">Упражнений</div></div>
          <div class="metric"><div class="metric__v">${workoutReps(w)}</div><div class="metric__l">Повторений</div></div>
        </div>
      </div>

      ${
        groups.length
          ? `<div class="section-title" style="padding-left:0"><h2>Группы мышц</h2></div>
          <div class="card card--pad">
            ${groups
              .map(
                (x) => `<div class="gbar">
                <span class="gbar__dot" style="background:${(GROUPS[x.group] || GROUPS.chest).color}"></span>
                <span class="gbar__label">${(GROUPS[x.group] || GROUPS.chest).label}</span>
                <span class="gbar__track"><span class="gbar__fill" style="width:${(x.sets / maxGroup) * 100}%;background:${(GROUPS[x.group] || GROUPS.chest).color}"></span></span>
                <span class="gbar__val num">${x.sets}</span>
              </div>`
              )
              .join('')}
          </div>`
          : ''
      }

      <div class="section-title" style="padding-left:0"><h2>Упражнения</h2></div>
      ${w.items
        .map((it) => {
          const ex = exerciseById(it.exerciseId);
          const g = GROUPS[ex?.group] || GROUPS.chest;
          const best = it.sets.reduce((b, s) => (e1rm(num(s.weight), num(s.reps)) > e1rm(num(b.weight), num(b.reps)) ? s : b), it.sets[0] || {});
          return `<div class="card wo-ex">
          <div class="row">
            <span class="pick-ic" style="background:${g.color}1f;color:${g.color}">${icon('dumbbell', 17)}</span>
            <div class="grow" style="min-width:0">
              <div class="h3 ellipsis">${escapeHtml(ex?.name || it.exerciseId)}</div>
              <div class="muted">${g.label} · ${it.sets.length} ${plural(it.sets.length, 'подход', 'подхода', 'подходов')}</div>
            </div>
          </div>
          <div class="wo-sets">
            ${it.sets
              .map(
                (s, i) => `<span class="wo-set ${s === best ? 'is-best' : ''}">
                <span class="wo-set__i">${i + 1}</span>
                <span class="num">${num(s.weight)} × ${num(s.reps)}</span>
              </span>`
              )
              .join('')}
          </div>
        </div>`;
        })
        .join('')}

      ${w.notes ? `<div class="card card--pad" style="margin-top:12px"><div class="tiny">ЗАМЕТКА</div><p style="margin-top:6px;font-size:14.5px;color:var(--text-2)">${escapeHtml(w.notes)}</p></div>` : ''}

      <div class="btn-row" style="margin-top:18px">
        <button class="btn btn--primary" data-action="repeat-workout" data-id="${w.id}">${icon('repeat', 17)} Повторить</button>
        <button class="btn btn--soft" data-action="share-workout" data-id="${w.id}">${icon('share', 17)} Поделиться</button>
      </div>
      <button class="btn btn--ghost btn--block" style="margin-top:8px" data-action="delete-workout" data-id="${w.id}">${icon('trash', 16)} Удалить запись</button>
    </div>`;

  return {
    html:
      topbar({
        title: 'Тренировка',
        back: 'go-back',
        actions: `<button class="btn btn--icon btn--soft" data-action="workout-menu" data-id="${w.id}" aria-label="Меню">${icon('dots', 20)}</button>`,
      }) + `<div class="view">${body}</div>`,
    mount() {},
  };
}

/* ===== js\anatomy.js ===== */
/* ============================================================
   Карта мышц: фигура человека, мышцы показаны плоскими
   анатомическими блоками (как в фитнес-инфографике).
   Вид спереди. viewBox 320×560.
   ============================================================ */


const C = {
  skin: '#d7dae2',
  skinDark: '#c2c7d2',
  line: '#9aa1b2',
  shadow: '#b9bfcb',
};

const COLORS = {
  cold: '#6f5b9e',
  cool: '#8f6fd6',
  warm: '#b76fd9',
  hot: '#e06b9b',
  glow: '#f08aae',
};

function tone(pct) {
  if (pct >= 35) return COLORS.hot;
  if (pct >= 20) return COLORS.warm;
  if (pct >= 8) return COLORS.cool;
  return COLORS.cold;
}
function alpha(pct) {
  if (pct <= 0) return 0.12;
  return Math.min(0.92, 0.32 + pct / 90);
}

/* ---------- тело ---------- */
function body() {
  return `
  <g class="body" stroke="${C.line}" stroke-width="1.4" stroke-linejoin="round">

    <!-- торс: плечи 120..200, талия 140..180, бёдра 132..188 -->

    <!-- дельты -->
    <ellipse fill="${C.skin}" cx="114" cy="106" rx="17" ry="18"/>
    <ellipse fill="${C.skin}" cx="206" cy="106" rx="17" ry="18"/>
    <!-- руки -->
    <path fill="${C.skin}" d="M104 122c-6 15-9 33-10 52-1 18 0 35 2 50l3 20h25l-2-24-1-48 3-50h-20Z"/>
    <path fill="${C.skin}" d="M216 122c6 15 9 33 10 52 1 18 0 35-2 50l-3 20h-25l2-24 1-48-3-50h20Z"/>
    <!-- кисти -->
    <path fill="${C.skinDark}" d="M100 244c-2 13-2 24 0 31 2 8 7 12 13 12s11-4 12-12c2-7 2-18 0-31h-25Z"/>
    <path fill="${C.skinDark}" d="M220 244c2 13 2 24 0 31-2 8-7 12-13 12s-11-4-12-12c-2-7-2-18 0-31h25Z"/>
    <!-- ноги -->
    <path fill="${C.skin}" d="M160 238c-12 0-24 1-32 4-8 22-12 47-13 71-1 23 0 44 2 63l3 34h37l3-38c3-20 4-42 3-62-1-25-6-47-12-64l6-2Z"/>
    <path fill="${C.skin}" d="M160 238c12 0 24 1 32 4 8 22 12 47 13 71 1 23 0 44-2 63l-3 34h-37l-3-38c-3-20-4-42-3-62 1-25 6-47 12-64l-6-2Z"/>
    
    <!-- разделитель ног -->
    <!-- стопы -->
  </g>`;
}

/* ---------- мышцы ---------- */
function musclePath(pct, d, extra = '') {
  const c = tone(pct);
  return `<path d="${d}" fill="${c}" fill-opacity="${alpha(pct).toFixed(2)}" stroke="${c}" stroke-opacity="0.45" stroke-width="1.2" ${extra}/>`;
}

function muscles(pct) {
  const p = (g) => pct[g] || 0;

/* ===== js\anatomy360.js ===== */
/* ============================================================
   Вращающаяся карта мышц: 8 ракурсов фотографической фигуры
   + послойная подсветка каждой группы мышц по проценту нагрузки.
   ============================================================ */

const VIEWS = [0, 45, 90, 135, 180, 225, 270, 315];



const VIEW_NAME = {
  0: 'Спереди',
  45: 'Спереди-слева',
  90: 'Слева',
  135: 'Сзади-слева',
  180: 'Сзади',
  225: 'Сзади-справа',
  270: 'Справа',
  315: 'Спереди-справа',
};

const GROUP_LABEL = {
  chest: 'Грудь',
  back: 'Спина',
  shoulders: 'Плечи',
  arms: 'Руки',
  core: 'Пресс',
  glutes: 'Ягодицы',
  legs: 'Ноги',
};

/* палитра из манифеста: синий → голубой → жёлтый → оранжевый → красный */
const STOPS = [
  [0, [82, 123, 185]],
  [25, [99, 175, 203]],
  [50, [228, 200, 97]],
  [75, [241, 140, 56]],
  [100, [233, 30, 44]],
];

function heatColor(pct) {
  const v = Math.max(0, Math.min(100, pct));
  for (let i = 1; i < STOPS.length; i++) {
    const [p1, c1] = STOPS[i];
    const [p0, c0] = STOPS[i - 1];
    if (v <= p1) {
      const t = (v - p0) / (p1 - p0 || 1);
      const c = c0.map((x, k) => Math.round(x + (c1[k] - x) * t));
      return `rgb(${c[0]}, ${c[1]}, ${c[2]})`;
    }
  }
  return 'rgb(233, 30, 44)';
}

function frameHtml(angle, index, pct) {
  const n = String(angle).padStart(3, '0');
  const maxPct = Math.max(1, ...Object.values(pct));
  const tints = ZONES.map((zone) => {
    const v = zoneValue(zone, angle, pct);
    const ratio = v / maxPct;
    if (ratio < 0.3) return '';
    const rel = ratio * 100;
    const opacity = Math.min(0.9, 0.28 + ratio * 0.55);
    return (
      `<div class="f360-tint" data-zone="${zone}" data-pct="${v.toFixed(1)}" ` +
      `style="background:${heatColor(rel)};opacity:${opacity.toFixed(2)};` +
      `-webkit-mask-image:url(assets/anatomy/${n}-${zone}.png);` +
      `mask-image:url(assets/anatomy/${n}-${zone}.png)"></div>`
    );
  }).join('');
  return (
    `<div class="f360-frame ${index === 0 ? 'is-on' : ''}" data-frame="${angle}">` +
    `<img class="f360-frame__body" src="assets/anatomy/${n}-body.webp" alt="" ` +
    `loading="${index < 2 ? 'eager' : 'lazy'}" draggable="false">` +
    `<div class="f360-frame__tints">${tints}</div>` +
    `</div>`
  );
}

/**
 * @param {Record<string, number>} pct — проценты по группам мышц
 */
function anatomy360Html(pct = {}) {
  const frames = VIEWS.map((a, i) => frameHtml(a, i, pct)).join('');
  const dots = VIEWS.map(
    (a, i) =>
      `<button class="f360__dot ${i === 0 ? 'is-on' : ''}" data-goto="${i}" aria-label="${VIEW_NAME[a]}"></button>`
  ).join('');
  return `<div class="f360" data-angle="0">
    <div class="f360__stage" data-stage>
      ${frames}
      <span class="f360__badge" data-badge>Спереди</span>
    </div>
    <div class="f360__legend"><span>меньше</span><i class="f360__grad"></i><span>больше</span></div>
    <div class="f360__nav">
      <button class="f360__arrow" data-dir="-1" aria-label="Повернуть влево">‹</button>
      <div class="f360__dots">${dots}</div>
      <button class="f360__arrow" data-dir="1" aria-label="Повернуть вправо">›</button>
    </div>
    <div class="f360__hint">Потяните фигуру, чтобы повернуть</div>
  </div>`;
}

/** Навешивает вращение: свайп, кнопки, точки */
function mountAnatomy360(root = document) {
  const fig = root.querySelector('.f360');
  if (!fig) return;
  const frames = [...fig.querySelectorAll('.f360-frame')];
  const dots = [...fig.querySelectorAll('.f360__dot')];
  const badge = fig.querySelector('[data-badge]');
  const stage = fig.querySelector('[data-stage]');
  let idx = 0;

  const show = (next) => {
    idx = (next + frames.length) % frames.length;
    frames.forEach((f, i) => f.classList.toggle('is-on', i === idx));
    dots.forEach((d, i) => d.classList.toggle('is-on', i === idx));
    const angle = Number(frames[idx].dataset.frame);
    if (badge) badge.textContent = VIEW_NAME[angle] || '';
    fig.dataset.angle = String(angle);
    fig.dispatchEvent(new CustomEvent('f360:change', { detail: { angle, index: idx } }));
  };

  for (const b of fig.querySelectorAll('[data-goto]')) {
    b.addEventListener('click', () => show(Number(b.dataset.goto)));
  }
  for (const b of fig.querySelectorAll('[data-dir]')) {
    b.addEventListener('click', () => show(idx + Number(b.dataset.dir)));
  }

  let startX = null;
  let startY = null;
  let moved = false;
  stage.addEventListener('pointerdown', (e) => {
    startX = e.clientX;
    startY = e.clientY;
    moved = false;
    stage.style.cursor = 'grabbing';
  });
  stage.addEventListener('pointermove', (e) => {
    if (startX == null) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    if (!moved && Math.abs(dx) > 26 && Math.abs(dx) > Math.abs(dy) * 1.2) {
      moved = true;
      show(idx + (dx < 0 ? 1 : -1));
      startX = e.clientX;
      startY = e.clientY;
    }
  });
  const end = () => {
    startX = null;
    stage.style.cursor = '';
  };
  stage.addEventListener('pointerup', end);
  stage.addEventListener('pointercancel', end);
  stage.addEventListener('pointerleave', end);

  // предзагрузка кадров
  for (const f of frames) {
    const img = f.querySelector('img');
    if (img && !img.complete) img.loading = 'eager';
  }
}

function estimateUsage() {
  let total = 0;
  for (const p of state.photos || []) total += (p.data || '').length;
  return total;
}

function compressImage(file, maxSide = 1100, quality = 0.72) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = () => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        let { width, height } = img;
        const scale = Math.min(1, maxSide / Math.max(width, height));
        width = Math.round(width * scale);
        height = Math.round(height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#0b0c0f';
        ctx.fillRect(0, 0, width, height);
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ---------- графики ---------- */
function barChart(data, { fmt: fmtFn = (v) => v, accent = 'var(--accent)', height = 104 } = {}) {
  if (!data.length) return '<div class="muted">Нет данных</div>';
  const max = Math.max(1, ...data.map((d) => d.value));
  return `<div class="bars" style="height:${height}px">
    ${data
      .map(
        (d) => `<div class="bars__col">
          <div class="bars__val num">${d.value ? fmtFn(d.value) : ''}</div>
          <div class="bars__track">
            <div class="bars__bar" style="height:${Math.max(2, (d.value / max) * 100)}%;background:${d.value ? accent : 'var(--surface-3)'}"></div>
          </div>
          <div class="bars__label">${d.label}</div>
        </div>`
      )
      .join('')}
  </div>`;
}

function lineChart(points, { unit = '', color = 'var(--accent)', height = 110 } = {}) {
  if (points.length < 2) return '<div class="muted">Мало данных для графика</div>';
  const W = 300;
  const H = height;
  const padX = 6;
  const padY = 14;
  const vals = points.map((p) => p.value);
  let min = Math.min(...vals);
  let max = Math.max(...vals);
  if (max - min < 1) {
    min -= 1;
    max += 1;
  }
  const span = max - min;
  const x = (i) => padX + (i / (points.length - 1)) * (W - padX * 2);
  const y = (v) => H - padY - ((v - min) / span) * (H - padY * 2);
  const path = points.map((p, i) => `${i === 0 ? 'M' : 'L'}${x(i).toFixed(1)},${y(p.value).toFixed(1)}`).join(' ');
  const area = `${path} L${x(points.length - 1).toFixed(1)},${H - 2} L${padX},${H - 2} Z`;
  const last = points[points.length - 1];
  const first = points[0];
  const diff = last.value - first.value;
  return `<div class="linechart">
    <div class="row" style="margin-bottom:4px">
      <span class="num" style="font-weight:720;font-size:17px">${fmt(last.value, 1)} ${unit}</span>
      <span class="spacer"></span>
      <span class="badge ${diff > 0 ? 'badge--accent' : diff < 0 ? 'badge--warn' : ''}">${diff > 0 ? '+' : ''}${fmt(diff, 1)} ${unit}</span>
    </div>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" class="linechart__svg" style="width:100%;height:${H}px">
      <defs><linearGradient id="lg-${unit}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="${color}" stop-opacity=".28"/>
        <stop offset="1" stop-color="${color}" stop-opacity="0"/>
      </linearGradient></defs>
      <path d="${area}" fill="url(#lg-${unit})"/>
      <path d="${path}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
      ${points
        .map(
          (p, i) =>
            i === points.length - 1 || i === 0
              ? `<circle cx="${x(i)}" cy="${y(p.value)}" r="3.2" fill="${color}"/>`
              : ''
        )
        .join('')}
    </svg>
    <div class="row" style="margin-top:2px">
      <span class="tiny">${fmtDateShort(first.date)}</span>
      <span class="spacer"></span>
      <span class="tiny">${fmtDateShort(last.date)}</span>
    </div>
  </div>`;
}

function groupBars(gv) {
  const max = Math.max(1, ...Object.values(gv).map((x) => x.sets));
  const entries = GROUP_ORDER.map((g) => ({ g, ...gv[g] })).filter((x) => x.sets > 0);
  if (!entries.length) return '<div class="muted">Пока нет данных за период</div>';
  return entries
    .sort((a, b) => b.sets - a.sets)
    .map(
      (x) => `<div class="gbar">
        <span class="gbar__dot" style="background:${GROUPS[x.g].color}"></span>
        <span class="gbar__label">${GROUPS[x.g].label}</span>
        <span class="gbar__track"><span class="gbar__fill" style="width:${(x.sets / max) * 100}%;background:${GROUPS[x.g].color}"></span></span>
        <span class="gbar__val num">${x.sets}</span>
      </div>`
    )
    .join('');
}

const BASE_WEIGHTS = {
  'bench-press': 60, 'incline-db-press': 22, 'db-fly': 12, 'cable-crossover': 15,
  'bent-row': 55, 'lat-pulldown': 50, 'seated-row': 45, 'db-row': 26, 'pull-up': 0,

  'hip-thrust': 90, 'bulgarian-split': 16, 'leg-ext': 45,
  'curl': 25, 'hammer-curl': 12, 'pushdown': 30, 'french-press': 16,
  'plank': 0, 'crunch': 0, 'hanging-knee-raise': 0, 'cable-crunch': 25,
};

const REP_TARGETS = {
  'bench-press': 8, 'squat': 8, 'bent-row': 8, 'rdl': 10, 'lat-pulldown': 12,
  'leg-press': 12, 'ohp': 8, 'hip-thrust': 10, 'leg-curl': 12, 'lateral-raise': 15,
  'face-pull': 15, 'db-shoulder-press': 10, 'incline-db-press': 10, 'db-fly': 12,
  'cable-crossover': 15, 'seated-row': 10, 'db-row': 10, 'pull-up': 6, 'curl': 10,
  'hammer-curl': 12, 'pushdown': 12, 'french-press': 12, 'bulgarian-split': 10,
  'leg-ext': 12, 'calf-raise': 15, 'plank': 45, 'crunch': 15, 'hanging-knee-raise': 12,
  'cable-crunch': 12,
};

function dayTemplate(kind) {
  const t = {
    push: [
      ['bench-press', 4], ['ohp', 3], ['incline-db-press', 3], ['lateral-raise', 4],
      ['pushdown', 3], ['cable-crossover', 3],
    ],
    pull: [
      ['pull-up', 3], ['bent-row', 4], ['seated-row', 3], ['face-pull', 3],
      ['curl', 3], ['hammer-curl', 3],
    ],
    legs: [
      ['squat', 4], ['rdl', 3], ['leg-press', 4], ['leg-curl', 3],
      ['calf-raise', 4], ['hanging-knee-raise', 3],
    ],
  }[kind];
  return { kind, items: t };
}

const NAMES = { push: 'Жимы', pull: 'Тяги', legs: 'Ноги' };

function seedDemo() {
  const workouts = [];
  const start = addDays(new Date(), -74);
  let week = 0;
  // 3 тренировки в неделю, 10 недель + постепенная прогрессия
  for (let d = 0; d < 75; d += 1) {
    const date = addDays(start, d);
    const dow = date.getDay(); // 1 пн, 3 ср, 5 пт
    const map = { 1: 'push', 3: 'pull', 5: 'legs' };
    const kind = map[dow];
    if (!kind) continue;
    if (Math.random() < 0.12) continue; // иногда пропуск
    const weekIdx = Math.floor(d / 7);
    const progress = 1 + weekIdx * 0.022; // +2.2% в неделю
    const tpl = dayTemplate(kind);
    const items = tpl.items.map(([exId, sets], idx) => {
      const base = BASE_WEIGHTS[exId] ?? 20;
      const repsTarget = REP_TARGETS[exId] ?? 10;
      const isTime = exId === 'plank' || exId === 'hanging-knee-raise' || exId === 'crunch';
      const weight = base ? Math.round((base * progress * (0.97 + Math.random() * 0.07)) / 2.5) * 2.5 : 0;
      const setList = Array.from({ length: sets }, (_, i) => {
        const fatigue = i > 1 ? 1 - (i - 1) * 0.04 : 1;
        const reps = isTime
          ? Math.max(20, Math.round(repsTarget * progress * (0.9 + Math.random() * 0.25)))
          : Math.max(4, Math.round(repsTarget * fatigue * (0.92 + Math.random() * 0.18) * progress));
        return { id: uid('s'), weight, reps, done: true };
      });
      return {
        id: uid('it'),
        exerciseId: exId,
        note: '',
        rest: 90,
        targetSets: sets,
        targetReps: `${Math.max(4, Math.round(repsTarget * 0.8))}-${Math.round(repsTarget * 1.2)}`,
        sets: setList,
      };
    });
    const startedAt = new Date(date);
    startedAt.setHours(19, 5 + Math.floor(Math.random() * 20), 0, 0);
    const durationMin = 55 + Math.round(Math.random() * 25);
    const finishedAt = startedAt.getTime() + durationMin * 60000 + 240000;
    workouts.push({
      id: uid('w'),
      name: `${NAMES[kind]} · PPL`,
      programId: 'ppl',
      dayIndex: kind === 'push' ? 0 : kind === 'pull' ? 1 : 2,
      date: isoDate(date),
      startedAt: startedAt.getTime(),
      finishedAt,
      notes: '',
      items,
    });
  }

  // замеры: вес снижается, грудь и руки растут
  const measurements = [];
  for (let d = 0; d <= 72; d += 7) {
    const date = addDays(start, d);
    const t = d / 72;
    measurements.push({
      id: uid('m'),
      date: isoDate(date),
      weight: Math.round((86 - t * 5.2 + (Math.random() - 0.5) * 0.8) * 10) / 10,
      waist: Math.round((92 - t * 4.5) * 10) / 10,
      chest: Math.round((104 + t * 3.2) * 10) / 10,
      biceps: Math.round((37 + t * 1.6) * 10) / 10,
      hips: Math.round((98 - t * 2.2) * 10) / 10,
      note: d === 0 ? 'старт' : '',
      createdAt: date.getTime(),
    });
  }

  state.workouts = [...workouts, ...(state.workouts || [])];
  state.measurements = [...measurements, ...(state.measurements || [])];
  state.settings.name = state.settings.name || 'Атлет';
  state.settings.weeklyGoal = state.settings.weeklyGoal || 4;
  state.settings.weight = measurements[measurements.length - 1].weight;
  state.activeProgramId = 'ppl';
  state.programStart = start.getTime();
  save({ immediate: true });
  return workouts.length;
}

/* ---------- программы: экспорт / импорт ---------- */
function doExportPrograms() {
  const list = (state.programs || []).map((p) => ({ ...p }));
  const payload = {
    app: 'atlet-programs',
    version: 1,
    exportedAt: new Date().toISOString(),
    count: list.length,
    programs: list,
  };
  download(`atlet-programmy-${isoDate(new Date())}.json`, JSON.stringify(payload, null, 2));
  toast(`Экспортировано программ: ${list.length}`);
}

function doImportPrograms() {
  const input = document.createElement("input");
  input.type = "file";
  input.accept = "application/json,.json";
  input.onchange = async () => {
    const file = input.files?.[0];
    if (!file) return;
    try {
      const data = JSON.parse(await file.text());
      const list = Array.isArray(data) ? data : data.programs;
      if (!Array.isArray(list) || !list.length) {
        toast("В файле нет программ", "danger");
        return;
      }
      const have = new Set((state.programs || []).map((p) => p.id));
      const fresh = list.filter((p) => p && p.id && p.name && !have.has(p.id));
      state.programs = [...(state.programs || []), ...fresh];
      save({ immediate: true });
      toast(fresh.length ? `Добавлено программ: ${fresh.length}` : "Все программы уже есть");
      refresh();
    } catch (e) {
      console.error(e);
      toast("Не удалось прочитать файл программ", "danger");
    }
  };
  input.click();
}

    const onlyDate = line.match(/^(?:дата|date)[:\s]*/i) ? dateFromLine(line) : null;
    if (onlyDate && !SET_RE.test(line)) {
      current = { date: onlyDate, name: 'Тренировка', items: [] };
      workouts.push(current);
      SET_RE.lastIndex = 0;
      continue;
    }

    // дата в начале строки + название тренировки, но без подходов
    if (!SET_RE.test(line) && !REPS_ONLY_RE.test(line)) {
      SET_RE.lastIndex = 0;
      const iso = line.match(ISO_RE);
      if (iso) {
        const rest = line.replace(ISO_RE, '').replace(/^[—–-]\s*/, '').trim();
        current = { date: `${iso[1]}-${iso[2]}-${iso[3]}`, name: rest || 'Тренировка', items: [] };
        workouts.push(current);
        continue;
      }
      const d = dateFromLine(line);
      if (d) {
        const rest = line.replace(DATE_RE, '').replace(DATE_TEXT_RE, '').replace(/^(дата|date)[:\s]*/i, '').replace(/^[—–-]\s*/, '').trim();
        current = { date: d, name: rest || 'Тренировка', items: [] };
        workouts.push(current);
        continue;
      }
    }
    SET_RE.lastIndex = 0;

    // CSV-строка с датой
    const csv = parseCSV(line);
    if (csv) {
      let w = workouts.find((x) => x.date === csv.dateIso);
      if (!w) {
        w = { date: csv.dateIso, name: 'Тренировка', items: [] };
        workouts.push(w);
      }
      const ex = matchExercise(csv.name);
      if (!ex) {
        problems.push(`Не найдено упражнение: «${csv.name}»`);
        continue;
      }
      w.items.push({ exerciseId: ex.id, sets: csv.sets });
      continue;
    }

    if (!current) {
      current = { date: isoDate(new Date()), name: 'Импорт', items: [] };
      workouts.push(current);
    }

    // строка: название упражнения + подходы
    const setList = parseSets(line);
    if (setList.length) {
      const namePart = line
        .replace(SET_RE, '')
        .replace(REPS_ONLY_RE, (m, g) => m.slice(0, m.indexOf(g)))
        .replace(/[—–\-:]+$/, '')
        .replace(/[,\s]+$/, '')
        .trim();
      const ex = matchExercise(namePart);
      if (ex) {
        current.items.push({ exerciseId: ex.id, sets: setList });
        continue;
      }
      if (namePart) {
        problems.push(`Не найдено упражнение: «${namePart}»`);
        unknown.push({ name: cleanExerciseName(namePart), sets: setList, date: current?.date });
      }
    } else {
      const ex = matchExercise(line);
      if (ex) {
        current.items.push({ exerciseId: ex.id, sets: [] });
        continue;
      }
    }
  }

  const measurements = parseMeasurements(text);

  return {
    unknown,
    workouts: workouts
      .map((w) => ({ ...w, items: w.items.filter((it) => it.sets.length) }))
      .filter((w) => w.items.length),
    measurements,
    problems,
  };
}

/** Превращает распознанное в полноценный объект state */
function buildWorkouts(parsed) {
  const out = [];
  for (const w of parsed.workouts) {
    const startedAt = new Date(`${w.date}T19:00:00`).getTime();
    const items = w.items.map((it) => ({
      id: uid('it'),
      exerciseId: it.exerciseId,
      note: '',
      rest: null,
      targetSets: it.sets.length,
      targetReps: String(it.sets[0]?.reps || 8),
      sets: it.sets.map((s) => ({
        id: uid('s'),
        weight: s.weight,
        reps: s.reps,
        done: true,
        completedAt: startedAt,
      })),
    }));
    let volume = 0;
    for (const it of items) for (const s of it.sets) volume += s.weight * s.reps;
    const durationMin = Math.max(25, Math.min(120, 20 + items.length * 6));
    out.push({
      id: uid('w'),
      name: w.name || 'Тренировка',
      programId: null,
      dayIndex: null,
      date: w.date,
      startedAt,
      finishedAt: startedAt + durationMin * 60000,
      notes: '',
      items,
      imported: true,
    });
  }
  return out;
}

function importWorkouts(list, { replace = false } = {}) {
  const existing = replace ? [] : state.workouts || [];
  // не дублируем одинаковые записи
  const key = (w) =>
    `${w.date}|${(w.items || []).map((i) => i.exerciseId + ':' + i.sets.map((s) => `${s.weight}x${s.reps}`).join(',')).join('|')}`;
  const have = new Set(existing.map(key));
  const fresh = list.filter((w) => !have.has(key(w)));
  state.workouts = [...existing, ...fresh].sort((a, b) => b.startedAt - a.startedAt);
  save({ immediate: true });
  return fresh.length;
}

/** Создаёт свои упражнения для незнакомых названий и добавляет подходы в тренировки */
function adoptUnknown(parsed) {
  if (!parsed?.unknown?.length) return 0;
  let created = 0;
  for (const u of parsed.unknown) {
    let ex = matchExercise(u.name);
    if (!ex) {
      const guessGroup = /присед|выпад|ног|ягод/i.test(u.name)
        ? 'legs'
        : /жим|груд|развед/i.test(u.name)
          ? 'chest'
          : /тяга|спин|подтяг/i.test(u.name)
            ? 'back'
            : /бицепс|трицепс|рук/i.test(u.name)
              ? 'arms'
              : /плеч|дельт|мах/i.test(u.name)
                ? 'shoulders'
                : /пресс|планк|скруч|живот/i.test(u.name)
                  ? 'core'
                  : 'other';
      ex = {
        id: 'c-' + uid('x'),
        name: u.name,
        group: guessGroup,
        eq: 'other',
        level: 1,
        compound: false,
        cues: ['Своё упражнение, добавлено при импорте истории.'],
        alts: [],
        time: false,
        dist: false,
        custom: true,
      };
      state.customExercises = [...(state.customExercises || []), ex];
      created++;
    }
    const w = (parsed.workouts || []).find((x) => x.date === u.date);
    if (w) w.items.push({ exerciseId: ex.id, sets: u.sets });
  }
  if (created) save({ immediate: true });
  parsed.unknown = [];
  parsed.problems = (parsed.problems || []).filter((p) => !p.startsWith('Не найдено упражнение'));
  return created;
}

/** Добавляет замеры (вес/обхваты), по одной записи на дату */
function importMeasurements(measures, dateIso = isoDate(new Date())) {
  if (!measures || !Object.keys(measures).length) return 0;
  const clean = {};
  for (const [k, v] of Object.entries(measures)) {
    const n = num(v);
    if (n > 0 && n < 1000) clean[k] = n;
  }
  if (!Object.keys(clean).length) return 0;
  const list = state.measurements || [];
  const existing = list.find((m) => m.date === dateIso);
  if (existing) Object.assign(existing, clean, { updatedAt: Date.now() });
  else list.push({ id: uid('m'), date: dateIso, ...clean, createdAt: Date.now() });
  state.measurements = list.sort((a, b) => (a.date < b.date ? -1 : 1));
  if (clean.weight) state.settings.weight = clean.weight;
  save({ immediate: true });
  return 1;
}

const LABELS = { chest: 'Грудь', back: 'Спина', legs: 'Ноги', glutes: 'Ягодицы', shoulders: 'Плечи', arms: 'Руки', core: 'Пресс', cardio: 'Кардио', sport: 'Спорт' };
const GENERIC_NAME = /^(Тренировка|Импорт|Грудь \+ Руки|Ноги \+ Спина|Грудь \+ Спина|Ноги \+ Руки|Спина \+ Руки|Грудь \+ Плечи|Ноги \+ Ягодицы)$/;

/** Имя тренировки по двум самым нагруженным группам мышц */
function workoutNameByGroups(w) {
  const sets = new Map();
  for (const it of w.items || []) {
    if (it.exerciseId && it.exerciseId.startsWith('sport-')) {
      sets.set('sport', (sets.get('sport') || 0) + 3);
      continue;
    }
    const g = exerciseGroup(it.exerciseId);
    const n = (it.sets || []).filter((x) => x.done).length || (it.sets || []).length;
    sets.set(g, (sets.get(g) || 0) + n);
  }
  const top = [...sets.entries()].sort((a, b) => b[1] - a[1]).slice(0, 2).map(([g]) => LABELS[g]).filter(Boolean);
  return top.join(' + ') || 'Тренировка';
}

/** Исправляет имена уже импортированных записей «Тренировка» → по группам мышц */
function fixNoNameWorkouts() {
  const labels = { chest: 'Грудь', back: 'Спина', legs: 'Ноги', glutes: 'Ягодицы', shoulders: 'Плечи', arms: 'Руки', core: 'Пресс', cardio: 'Кардио', sport: 'Спорт' };
  let fixed = 0;
  for (const w of state.workouts || []) {
    if (!w.imported && w.name && !GENERIC_NAME.test(w.name)) continue;
    if (w.name && !GENERIC_NAME.test(w.name) && w.name !== 'Тренировка') continue;
    const name = workoutNameByGroups(w);
    if (name && name !== w.name) {
      w.name = name;
      fixed++;
    }
  }
  if (fixed) save({ immediate: true });
  return fixed;
}

    refresh();
  });

  return sh;
}

/** Приводит чужой JSON к нашему виду (дата, упражнение, подходы) */
function normalizeForeignWorkout(raw) {
  if (!raw || typeof raw !== 'object') return null;
  const dateRaw = raw.date || raw.day || raw.startedAt || raw.created_at || raw.finishedAt;
  let dateIso = isoDate(new Date());
  if (typeof dateRaw === 'string') {
    if (/^\d{4}-\d{2}-\d{2}/.test(dateRaw)) dateIso = dateRaw.slice(0, 10);
    else {
      const d = parseDate(dateRaw);
      if (d) dateIso = isoDate(d);
    }
  } else if (typeof dateRaw === 'number') {
    dateIso = isoDate(new Date(dateRaw));
  }

  let items = [];
  if (Array.isArray(raw.items)) items = raw.items;
  else if (Array.isArray(raw.exercises)) items = raw.exercises;
  else if (Array.isArray(raw.sets)) {
    // плоский формат: [{exercise, weight, reps}]
    items = [];
    for (const s of raw.sets) {
      const name = s.exercise || s.exerciseName || s.title;
      if (!name) continue;
      items.push({ name, sets: [{ weight: s.weight ?? s.kg, reps: s.reps ?? s.repeat }] });
    }
  }

  const out = [];
  for (const it of items) {
    const name = it.name || it.exercise || it.title || it.exerciseName;
    if (!name) continue;
    let ex = matchExercise(name);
    if (!ex) continue; // неизвестные добавляются отдельно
    const rawSets = it.sets || it.reps || it.performedSets || [];
    let sets = [];
    if (Array.isArray(rawSets)) {
      for (const s of rawSets) {
        if (typeof s === 'number') sets.push({ weight: 0, reps: s });
        else if (typeof s === 'string') {
          const m = s.match(/(\d+(?:[.,]\d+)?)\s*[xх×]\s*(\d+)/i);
          if (m) sets.push({ weight: num(m[1]), reps: num(m[2]) });
          else {
            const r = num(s);
            if (r > 0 && r <= 100) sets.push({ weight: 0, reps: r });
          }
        } else if (s && typeof s === 'object') {
          const w = num(s.weight ?? s.kg ?? s.load);
          const r = num(s.reps ?? s.repeat ?? s.repsCount ?? s.count);
          if (r > 0) sets.push({ weight: w, reps: r });
        }
      }
    }
    if (sets.length) out.push({ exerciseId: ex.id, sets });
  }
  if (!out.length) return null;
  const startedAt = new Date(`${dateIso}T19:00:00`).getTime();
  return {
    id: uid('w'),
    name: raw.name || raw.title || 'Импортированная тренировка',
    programId: null,
    dayIndex: null,
    date: dateIso,
    startedAt,
    finishedAt: startedAt + 60 * 60000,
    notes: raw.notes || raw.note || '',
    items: out.map((it) => ({
      id: uid('it'),
      exerciseId: it.exerciseId,
      note: '',
      rest: null,
      targetSets: it.sets.length,
      targetReps: String(it.sets[0].reps || 8),
      sets: it.sets.map((s) => ({ id: uid('s'), weight: s.weight, reps: s.reps, done: true })),
    })),
    imported: true,
  };
}

/** Иконка по виду спорта */
function sportIcon(id) {
  if (id.includes('football') || id.includes('hockey')) return 'target';
  if (id.includes('volleyball') || id.includes('basketball')) return 'target';
  if (id.includes('tennis') || id.includes('badminton')) return 'switch';
  if (id.includes('swimming')) return 'volume';
  if (id.includes('running') || id.includes('hiking')) return 'trendUp';
  if (id.includes('cycling')) return 'repeat';
  if (id.includes('martial')) return 'bolt';
  if (id.includes('dance')) return 'sparkles';
  if (id.includes('yoga')) return 'heart';
  return 'target';
}

    ${SPORTS.map(

        <span class="sport-pick__ic">${icon(sportIcon(s.id), 18)}</span>
        <span class="grow">${escapeHtml(s.name)}
          <span class="sport-pick__meta">${Object.keys(s.load).filter((g) => g !== 'cardio').length} групп мышц${s.dist ? ' · дистанция' : ''}</span>
        </span>
      </button>`
    ).join('')}
  </div>`;
  const sh = sheet({
    title: 'Добавить спорт',
    sub: 'Футбол, волейбол, теннис и другие активности',
    body,
  });
  for (const b of sh.el.querySelectorAll('[data-sport]')) {
    b.addEventListener('click', () => {
      const sport = SPORTS.find((s) => s.id === b.dataset.sport);
      if (!sport) return;
      sh.close('pick');
      if (onPick) onPick(sport);
      else askDurationAndStart(sport);
    });
  }
  return sh;
}

/** Спрашивает длительность и создаёт тренировку со спортом */
function askDurationAndStart(sport) {
  let minutes = 60;
  const body = `<div class="sport-duration">
      <button class="chip" data-dur="-15">−15</button>
      <div class="sport-duration__val" data-dur-val>${minutes}<small>мин</small></div>
      <button class="chip" data-dur="15">+15</button>
    </div>
    <div class="chip-row" style="justify-content:center;margin-top:6px">
      ${[30, 45, 60, 90, 120].map((m) => `<button class="chip ${m === minutes ? 'is-on' : ''}" data-dur-set="${m}">${m} мин</button>`).join('')}
    </div>
    ${sport.dist ? `<div class="field" style="margin-top:16px"><div class="field__label">Дистанция, км</div>
      <input class="input" type="number" inputmode="decimal" step="0.1" min="0" data-field="dist" placeholder="0"></div>` : ''}
    <div class="hint-box" style="margin-top:16px">${icon('info', 16)}<span>Длительность пойдёт в общий объём и в нагрузку по группам мышц: ${Object.entries(sport.load)
      .filter(([g]) => g !== 'cardio')
      .map(([g, v]) => `${groupLabel(g)} ${Math.round(v * 100)}%`)
      .join(', ')}</span></div>`;
  const sh = sheet({
    title: escapeHtml(sport.name),
    sub: 'Сколько длилась активность?',
    body,
    foot: `<button class="btn btn--soft" data-close>Отмена</button><button class="btn btn--primary" data-start>${icon('play', 17)} Записать</button>`,
  });
  const valEl = sh.el.querySelector('[data-dur-val]');
  const render = () => {
    valEl.innerHTML = `${minutes}<small>мин</small>`;
    for (const b of sh.el.querySelectorAll('[data-dur-set]')) {
      b.classList.toggle('is-on', Number(b.dataset.durSet) === minutes);
    }
  };
  for (const b of sh.el.querySelectorAll('[data-dur]')) {
    b.addEventListener('click', () => {
      minutes = Math.max(5, Math.min(300, minutes + Number(b.dataset.dur)));
      render();
    });
  }
  for (const b of sh.el.querySelectorAll('[data-dur-set]')) {
    b.addEventListener('click', () => {
      minutes = Number(b.dataset.durSet);
      render();
    });
  }
  sh.el.querySelector('[data-start]').addEventListener('click', () => {
    const dist = Number(sh.el.querySelector('[data-field="dist"]')?.value) || 0;
    sh.close('start');
    recordSport(sport, minutes, dist);
  });
  render();
  return sh;
}

/** Создаёт запись о спорте: тренировка с одним «упражнением»-спортом */
function recordSport(sport, minutes, distance = 0, dateIso = null) {
  const date = dateIso || isoDate(new Date());
  const startedAt = new Date().getTime() - minutes * 60000;
  const workout = {
    id: uid('w'),
    name: sport.name,
    programId: null,
    dayIndex: null,
    date,
    startedAt,
    finishedAt: Date.now(),
    notes: '',
    items: [
      {
        id: uid('it'),
        exerciseId: sport.id,
        note: '',
        rest: null,
        targetSets: 1,
        targetReps: '60',
        sets: [
          {
            id: uid('s'),
            weight: 0,
            reps: 1,
            duration: minutes,
            distance: distance || 0,
            done: true,
            completedAt: Date.now(),
          },
        ],
      },
    ],
  };
  state.workouts = [workout, ...(state.workouts || [])].sort((a, b) => b.startedAt - a.startedAt);
  save({ immediate: true });
  toast(`${sport.name} · ${minutes} мин записано`);
  return workout;
}

function groupLabel(g) {
  return (
    {
      chest: 'грудь',
      back: 'спина',
      shoulders: 'плечи',
      arms: 'руки',
      core: 'пресс',
      glutes: 'ягодицы',
      legs: 'ноги',
    }[g] || g
  );
}

/** Добавить спорт в текущую активную тренировку */
function addSportToSession(sport) {
  const s = activeSession();
  if (!s) {
    toast('Сначала начните тренировку', 'info');
    return;
  }
  addExercise(sport.id, { sets: 1, reps: '60' });
  toast('Добавлено в тренировку');
}

  if (ui.view === 'session' && !activeSession()) {

    ui.sessionMode = false;
    document.getElementById('app').classList.remove('is-session');
  }
  const renderer = {

    journal: renderJournal,

  }[ui.view] || renderToday;
  const res = renderer(ui.params) || {};
  if (window.__DSH_DEBUG) console.log('[paint]', ui.view, 'renderer', renderer.name, 'res', res && typeof res, res?.html?.length);
  const app = document.getElementById('app');
  app.innerHTML = res.html || '';
  if (!app.innerHTML && ui.view) {
    console.error('[paint] пустой HTML для экрана', ui.view, ui.params);

  }

}

action('toggle-set', (el) => {
  const itemId = el.dataset.item;
  const setId = el.dataset.set;
  const s = activeSession();
  if (!s) return;
  const it = s.workout.items.find((x) => x.id === itemId);
  const set = it?.sets.find((x) => x.id === setId);
  if (!set) return;
  if (set.done) {
    uncompleteSet(itemId, setId);
    haptic();
    paint();
    return;
  }
  // если пусто — подставляем предыдущие значения
  if (!num(set.weight) && !num(set.reps)) {
    const last = lastPerformance(it.exerciseId);
    const idx = it.sets.indexOf(set);
    const prev = last?.sets?.[Math.min(idx, (last.sets?.length || 1) - 1)];
    if (prev) {
      updateSet(itemId, setId, { weight: num(prev.weight), reps: num(prev.reps) });
    } else if (!set.reps) {
      const ex = exerciseById(it.exerciseId);
      updateSet(itemId, setId, { reps: ex?.group === 'core' ? 30 : 10 });
    }
  }
  const res = completeSet(itemId, setId, { startRest: true });
  paint();
  if (res?.restStarted) {
    // даём DOM обновиться
    requestAnimationFrame(() => openRestSheet(null));
  } else if (res?.nextItem) {
    toast('Упражнение выполнено 💪');
  }
});

  p.days[di].items.splice(ii, 1);
  save({ immediate: true });
  paint();
});
action('save-program', (el) => {
  const p = (state.programs || []).find((x) => x.id === el.dataset.id);
  if (!p) return;
  const norm = normalizeProgram(p);
  p.name = norm.name || 'Без названия';
  p.days = norm.days.filter((d) => d.items.length);
  if (!p.days.length) {
    toast('Добавьте хотя бы одно упражнение', 'danger');
    return;
  }
  save({ immediate: true });
  toast('Программа сохранена');
  history.length = 0;
  navigate('program', { id: p.id });
});
action('delete-program', async (el) => {
  const p = (state.programs || []).find((x) => x.id === el.dataset.id);
  if (!p) return;
  const ok = await confirmDialog({ title: 'Удалить программу?', text: 'История тренировок останется, но программа исчезнет из списка.', ok: 'Удалить' });
  if (!ok) return;
  state.programs = (state.programs || []).filter((x) => x.id !== p.id);
  if (state.activeProgramId === p.id) state.activeProgramId = null;
  save({ immediate: true });
  history.length = 0;
  navigate('programs');
  toast('Программа удалена');
});

/* общее */
action('share-workout', async (el) => {
  const w = (state.workouts || []).find((x) => x.id === el.dataset.id);
  if (!w) return;
  const text = shareText(w);
  if (navigator.share) {
    try {
      await navigator.share({ title: w.name, text });
      return;
    } catch {}
  }
  await navigator.clipboard?.writeText(text).catch(() => {});
  toast('Текст скопирован');
});
action('share-program', async (el) => {
  const p = (state.programs || []).find((x) => x.id === el.dataset.id);
  if (!p) return;
  const text = programText(p);
  if (navigator.share) {
    try {
      await navigator.share({ title: p.name, text });
      return;
    } catch {}
  }
  await navigator.clipboard?.writeText(text).catch(() => {});
  toast('Скопировано');
});
action('repeat-workout', async (el) => {
  const w = (state.workouts || []).find((x) => x.id === el.dataset.id);
  if (!w) return;
  if (activeSession()) {
    const ok = await confirmDialog({ title: 'Уже есть активная тренировка', text: 'Начать новую с нуля? Текущая будет потеряна.', ok: 'Начать новую' });
    if (!ok) return;
    discardSession();
  }
  repeatWorkout(w);
  closeSheets();
  navigate('session');
  toast('Тренировка создана');
});
action('delete-workout', async (el) => {
  const ok = await confirmDialog({ title: 'Удалить тренировку?', text: 'Запись исчезнет из истории и аналитики.', ok: 'Удалить' });
  if (!ok) return;
  state.workouts = (state.workouts || []).filter((x) => x.id !== el.dataset.id);
  save({ immediate: true });
  history.length = 0;
  navigate('journal');
  toast('Удалено');
});

/* ---------- helpers ---------- */
function shareText(w) {
  const lines = [`${w.name} · ${fmtDate(w.date)}`, `Объём: ${Math.round(workoutVolume(w))} кг · ${workoutSets(w)} подходов`];
  const rows = [];
  for (const it of w.items || []) {
    const best = (it.sets || []).reduce((b, s) => (num(s.weight) > num(b?.weight) ? s : b), null);
    rows.push(`• ${exerciseName(it.exerciseId)}: ${(it.sets || []).map((s) => `${num(s.weight)}×${num(s.reps)}`).join(', ')}`);
  }
  return lines.concat(rows).join('\n');
}

function programText(p) {
  const out = [p.name, `${p.days.length} дня · ${programExerciseCount(p)} упражнений`];
  p.days.forEach((d, i) => {
    out.push('', `${i + 1}. ${d.name}${d.focus ? ' — ' + d.focus : ''}`);
    d.items.forEach((it) => out.push(`  • ${exerciseName(it.exerciseId)} — ${it.sets}×${it.reps}`));
  });
  return out.join('\n');
}

/* ============================================================
   Старт
   ============================================================ */
paint();

restTimer.restore();

// скрыть таймер при уходе
document.addEventListener('visibilitychange', () => {
  if (document.hidden) restTimer.save();
});

// service worker

// hash-route (просто чтобы не терять состояние при перезагрузке)
window.addEventListener('popstate', () => {
  if (topSheet()) {
    topSheet().close('popstate');
    return;
  }
  back();
});

// защита от случайного закрытия во время тренировки
window.addEventListener('beforeunload', (e) => {
  if (activeSession()) {
    e.preventDefault();
    e.returnValue = '';
  }
});

// обновление «сегодня» после возврата
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && activeSession() && ui.view === 'session') paint();
});


</script>
