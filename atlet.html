/* ============================================================
   Аналитика: объём, история упражнений, рекорды, стрики
   ============================================================ */






function sportAsExercise(s) {
  return {
    id: s.id,
    name: s.name,
    group: 'sport',
    eq: 'sport',
    level: 1,
    compound: false,
    cues: ['Спортивная активность: учитывается время и нагрузка на группы мышц.'],
    alts: [],
    time: true,
    dist: !!s.dist,
    sport: true,
    load: s.load,
    custom: false,
  };
}

function allExercises() {
  return [...baseExercises(), ...SPORTS.map(sportAsExercise), ...(state.customExercises || [])];
}

function isSportExercise(id) {
  return isSport({ id });
}

function exerciseById(id) {
  return allExercises().find((e) => e.id === id) || null;
}

function exerciseName(id) {
  return exerciseById(id)?.name || 'Упражнение';
}

function exerciseGroup(id) {
  return exerciseById(id)?.group || 'chest';
}

/** Суммарный тоннаж тренировки, кг */
function workoutVolume(w) {
  let v = 0;
  for (const it of w.items || []) {
    for (const s of it.sets || []) {
      if (!s.done) continue;
      v += num(s.weight) * num(s.reps);
    }
  }
  return v;
}

function workoutSets(w) {
  return (w.items || []).reduce((acc, it) => acc + (it.sets || []).filter((s) => s.done).length, 0);
}

function workoutReps(w) {
  return (w.items || []).reduce(
    (acc, it) => acc + sum(it.sets || [], (s) => (s.done ? num(s.reps) : 0)),
    0
  );
}

function workoutDuration(w) {
  if (!w.startedAt) return 0;
  const end = w.finishedAt || Date.now();
  return Math.max(0, Math.round((end - w.startedAt) / 1000));
}

function workoutGroups(w) {
  const map = new Map();
  for (const it of w.items || []) {
    const g = exerciseGroup(it.exerciseId);
    const vol = sum(it.sets || [], (s) => (s.done ? num(s.weight) * num(s.reps) : 0));
    const sets = (it.sets || []).filter((s) => s.done).length;
    const cur = map.get(g) || { group: g, volume: 0, sets: 0, seconds: 0 };
    cur.volume += vol;
    cur.sets += sets;
    cur.seconds += sum(it.sets || [], (s) => (s.done ? num(s.duration) * 60 : 0));
    map.set(g, cur);
  }
  return [...map.values()].sort((a, b) => b.volume - a.volume || b.sets - a.sets);
}

function finishedWorkouts() {
  return (state.workouts || [])
    .filter((w) => w.finishedAt)
    .slice()
    .sort((a, b) => (b.startedAt || 0) - (a.startedAt || 0));
}

function workoutsFrom(iso) {
  return finishedWorkouts().filter((w) => (w.date || isoDate(w.startedAt)) >= iso);
}

function last7() {
  const from = isoDate(addDays(new Date(), -6));
  return workoutsFrom(from);
}

function weekSummary(offsetWeeks = 0) {
  const start = startOfWeek(new Date());
  start.setDate(start.getDate() + offsetWeeks * 7);
  const from = isoDate(start);
  const to = isoDate(addDays(start, 6));
  const ws = finishedWorkouts().filter((w) => {
    const d = w.date || isoDate(w.startedAt);
    return d >= from && d <= to;
  });
  return {
    from,
    to,
    count: ws.length,
    volume: sum(ws, workoutVolume),
    seconds: sum(ws, workoutDuration),
    sets: sum(ws, workoutSets),
    workouts: ws,
  };
}

function currentStreak() {
  const days = new Set(finishedWorkouts().map((w) => w.date || isoDate(w.startedAt)));
  let d = new Date();
  let streak = 0;
  // если сегодня ещё не тренировались — начинаем со вчера
  if (!days.has(isoDate(d))) d = addDays(d, -1);
  while (days.has(isoDate(d))) {
    streak++;
    d = addDays(d, -1);
  }
  return streak;
}

/** История подходов по упражнению: [{date, workoutId, sets:[...], best:{weight,reps,e1rm}, volume}] */
function exerciseHistory(exerciseId) {
  const out = [];
  for (const w of finishedWorkouts()) {
    for (const it of w.items || []) {
      if (it.exerciseId !== exerciseId) continue;
      const sets = (it.sets || []).filter((s) => s.done);
      if (!sets.length) continue;
      let best = { weight: 0, reps: 0, e1rm: 0 };
      for (const s of sets) {
        const wv = num(s.weight);
        const rv = num(s.reps);
        const est = e1rm(wv, rv);
        if (est > best.e1rm) best = { weight: wv, reps: rv, e1rm: est, set: s };
      }
      out.push({
        date: w.date || isoDate(w.startedAt),
        workoutId: w.id,
        workoutName: w.name,
        sets,
        best,
        volume: sum(sets, (s) => num(s.weight) * num(s.reps)),
      });
    }
  }
  return out.sort((a, b) => (a.date < b.date ? 1 : -1));
}

function lastPerformance(exerciseId) {
  const h = exerciseHistory(exerciseId);
  return h[0] || null;
}

function personalRecords(exerciseId) {
  const h = exerciseHistory(exerciseId);
  let maxWeight = 0;
  let maxReps = 0;
  let maxVolume = 0;
  let best1rm = 0;
  for (const entry of h) {
    if (entry.best.weight > maxWeight) maxWeight = entry.best.weight;
    const reps = Math.max(...entry.sets.map((s) => num(s.reps)));
    if (reps > maxReps) maxReps = reps;
    const e = Math.max(...entry.sets.map((s) => e1rm(num(s.weight), num(s.reps))));
    if (e > best1rm) best1rm = e;
    if (entry.volume > maxVolume) maxVolume = entry.volume;
  }
  return { maxWeight, maxReps, maxVolume, best1rm, sessions: h.length };
}

/** Личные рекорды всей базы — топ упражнений по 1ПМ */
function topRecords(limit = 12) {
  const seen = new Set();
  const recs = [];
  for (const w of finishedWorkouts()) {
    for (const it of w.items || []) {
      if (seen.has(it.exerciseId)) continue;
      seen.add(it.exerciseId);
      const sets = (it.sets || []).filter((s) => s.done && num(s.reps) > 0);
      if (!sets.length) continue;
      const bestSet = sets.reduce(
        (b, s) => (e1rm(num(s.weight), num(s.reps)) > e1rm(num(b.weight), num(b.reps)) ? s : b),
        sets[0]
      );
      const wv = num(bestSet.weight);
      if (wv <= 0) continue;
      recs.push({
        exerciseId: it.exerciseId,
        name: exerciseName(it.exerciseId),
        weight: wv,
        reps: num(bestSet.reps),
        e1rm: e1rm(wv, num(bestSet.reps)),
        date: w.date || isoDate(w.startedAt),
      });
    }
  }
  // max weight по упражнению, а не по всем сессиям
  const byEx = new Map();
  for (const r of recs) {
    const cur = byEx.get(r.exerciseId);
    if (!cur || r.e1rm > cur.e1rm) byEx.set(r.exerciseId, r);
  }
  return [...byEx.values()].sort((a, b) => b.e1rm - a.e1rm).slice(0, limit);
}

/** Объём по группам мышц за период */
function groupVolume(fromIso, toIso = isoDate(new Date())) {
  const totals = {};
  for (const g of Object.keys(GROUPS)) totals[g] = { volume: 0, sets: 0 };
  const ws = finishedWorkouts().filter((w) => {
    const d = w.date || isoDate(w.startedAt);
    return d >= fromIso && d <= toIso;
  });
  for (const w of ws) {
    for (const it of w.items || []) {
      const g = exerciseGroup(it.exerciseId);
      if (!totals[g]) totals[g] = { volume: 0, sets: 0 };
      for (const s of it.sets || []) {
        if (!s.done) continue;
        totals[g].volume += num(s.weight) * num(s.reps) + (num(s.weight) === 0 ? num(s.reps) : 0);
        totals[g].sets += 1;
      }
    }
  }
  return totals;
}

/**
 * Нагрузка по группам мышц в процентах (как в Fitness Online):
 * силовые — подходы, спорт — минуты, пересчитанные в эквивалент подходов.
 * Возвращает { groups: [{group, pct, sets, seconds, isSport}], total, sportSeconds }
 */
function muscleLoad(fromIso, toIso = isoDate(new Date())) {
  const scores = {};
  const seconds = {};
  const rawSets = {};
  for (const g of Object.keys(GROUPS)) {
    scores[g] = 0;
    seconds[g] = 0;
    rawSets[g] = 0;
  }
  const ws = finishedWorkouts().filter((w) => {
    const d = w.date || isoDate(w.startedAt);
    return d >= fromIso && d <= toIso;
  });
  for (const w of ws) {
    for (const it of w.items || []) {
      const ex = exerciseById(it.exerciseId);
      const g = ex?.group || 'chest';
      const done = (it.sets || []).filter((s) => s.done);
      if (!done.length) continue;

      if (ex?.sport || isSportExercise(it.exerciseId)) {
        const sp = sportOf(ex) || { load: { legs: 0.5, core: 0.5, cardio: 0.5 } };
        const minutes = sum(done, (s) => num(s.duration));
        const eq = sportScore(minutes || 30);
        for (const [mg, weight] of Object.entries(sp.load)) {
          if (mg === 'cardio') {
            scores.cardio = (scores.cardio || 0) + eq * weight;
          } else if (scores[mg] !== undefined) {
            scores[mg] += eq * weight;
          }
        }
        seconds.sport = (seconds.sport || 0) + (minutes || 30) * 60;
        rawSets.sport = (rawSets.sport || 0) + 1;
      } else {
        const factor = ex?.compound ? 1.2 : 1;
        scores[g] = (scores[g] || 0) + done.length * factor;
        rawSets[g] += done.length;
        seconds[g] += sum(done, (s) => num(s.duration) * 60);
      }
    }
  }
  const total = Object.values(scores).reduce((x, y) => x + y, 0);
  const display = Object.keys(GROUPS)
    .map((g) => ({
      group: g,
      pct: total > 0 ? (scores[g] / total) * 100 : 0,
      sets: rawSets[g] || 0,
      seconds: seconds[g] || 0,
      isSport: g === 'cardio' || g === 'sport',
    }))
    .filter((x) => x.pct > 0.01)
    .sort((x, y) => y.pct - x.pct);
  return { groups: display, total, sportSeconds: seconds.sport || 0, workouts: ws.length };
}

/** Время по видам спорта за период: [{name, minutes, sessions}] */
function sportBreakdown(fromIso, toIso = isoDate(new Date())) {
  const map = new Map();
  const ws = finishedWorkouts().filter((w) => {
    const d = w.date || isoDate(w.startedAt);
    return d >= fromIso && d <= toIso;
  });
  for (const w of ws) {
    for (const it of w.items || []) {
      const ex = exerciseById(it.exerciseId);
      if (!ex?.sport) continue;
      const done = (it.sets || []).filter((s) => s.done);
      if (!done.length) continue;
      const minutes = sum(done, (s) => num(s.duration)) || workoutDuration(w) / 60;
      const cur = map.get(it.exerciseId) || { id: it.exerciseId, name: ex.name, minutes: 0, sessions: 0 };
      cur.minutes += minutes;
      cur.sessions += 1;
      map.set(it.exerciseId, cur);
    }
  }
  return [...map.values()].sort((a, b) => b.minutes - a.minutes);
}


/** Нагрузка по конкретным мышцам (бицепс, трицепс, квадрицепс и т.д.) */
function muscleLoadDetail(fromIso, toIso = isoDate(new Date())) {
  const scores = {};
  for (const m of MUSCLES) scores[m] = 0;
  const ws = finishedWorkouts().filter((w) => {
    const d = w.date || isoDate(w.startedAt);
    return d >= fromIso && d <= toIso;
  });
  for (const w of ws) {
    for (const it of w.items || []) {
      const ex = exerciseById(it.exerciseId);
      if (!ex) continue;
      const done = (it.sets || []).filter((s) => s.done);
      if (!done.length) continue;
      const mm = exerciseMuscles(ex);
      let amount;
      if (ex.sport) {
        const minutes = sum(done, (s) => num(s.duration)) || 45;
        amount = Math.max(0.6, minutes / 5);
      } else {
        amount = done.length * (ex.compound ? 1.15 : 1);
      }
      for (const [muscle, weight] of Object.entries(mm)) {
        if (scores[muscle] === undefined) continue;
        scores[muscle] += amount * weight;
      }
    }
  }
  const total = MUSCLES.reduce((x, m) => x + scores[m], 0);
  return MUSCLES.map((m) => ({
    muscle: m,
    score: scores[m],
    pct: total > 0 ? (scores[m] / total) * 100 : 0,
  })).sort((x, y) => y.pct - x.pct);
}

/** Данные для графика объёма по неделям: [{label, volume, count}] */
function weeklySeries(weeks = 8) {
  const out = [];
  for (let i = weeks - 1; i >= 0; i--) {
    const s = weekSummary(-i);
    out.push({
      label: i === 0 ? 'сейчас' : `${s.from.slice(8)}.${s.from.slice(5, 7)}`,
      volume: s.volume,
      count: s.count,
      seconds: s.seconds,
    });
  }
  return out;
}

/** Частота по неделям для графика */
function weeklyCount(weeks = 8) {
  const out = [];
  for (let i = weeks - 1; i >= 0; i--) {
    const s = weekSummary(-i);
    out.push({ label: i === 0 ? 'тек' : `${s.from.slice(8)}.${s.from.slice(5, 7)}`, value: s.count });
  }
  return out;
}

/** Топ упражнений по объёму и частоте */
function topExercises(limit = 8, days = 90) {
  const from = isoDate(addDays(new Date(), -days));
  const map = new Map();
  for (const w of finishedWorkouts()) {
    const d = w.date || isoDate(w.startedAt);
    if (d < from) continue;
    for (const it of w.items || []) {
      const sets = (it.sets || []).filter((s) => s.done);
      if (!sets.length) continue;
      const cur = map.get(it.exerciseId) || {
        exerciseId: it.exerciseId,
        sessions: 0,
        sets: 0,
        volume: 0,
        best: 0,
      };
      cur.sessions += 1;
      cur.sets += sets.length;
      cur.volume += sum(sets, (s) => num(s.weight) * num(s.reps));
      cur.best = Math.max(cur.best, ...sets.map((s) => num(s.weight)));
      map.set(it.exerciseId, cur);
    }
  }
  return [...map.values()]
    .sort((a, b) => b.sessions - a.sessions || b.volume - a.volume)
    .slice(0, limit)
    .map((r) => ({ ...r, name: exerciseName(r.exerciseId), group: exerciseGroup(r.exerciseId) }));
}

/** История замеров: последний и динамика */
function measurementSeries() {
  return (state.measurements || [])
    .slice()
    .sort((a, b) => (a.date < b.date ? -1 : 1));
}

function latestMeasurement() {
  const ser = measurementSeries();
  return ser.length ? ser[ser.length - 1] : null;
}

function weightSeries() {
  return measurementSeries()
    .filter((m) => num(m.weight) > 0)
    .map((m) => ({ date: m.date, value: num(m.weight) }));
}

/** Средняя длительность тренировки, мин */
function avgDuration() {
  const ws = finishedWorkouts();
  if (!ws.length) return 0;
  return Math.round(sum(ws.slice(0, 20), workoutDuration) / Math.min(20, ws.length) / 60);
}

function totalStats() {
  const ws = finishedWorkouts();
  return {
    workouts: ws.length,
    volume: sum(ws, workoutVolume),
    sets: sum(ws, workoutSets),
    hours: sum(ws, workoutDuration) / 3600,
    firstDate: ws.length ? ws[ws.length - 1].date || isoDate(ws[ws.length - 1].startedAt) : null,
  };
}

/** Предложение следующей тренировки */
function nextProgramDay(program) {
  if (!program || !program.days?.length) return null;
  const done = (state.workouts || []).filter(
    (w) => w.programId === program.id && w.finishedAt
  ).length;
  return program.days[done % program.days.length];
}

function lastWorkoutForProgram(programId) {
  const ws = finishedWorkouts().filter((w) => w.programId === programId);
  return ws[0] || null;
}

/** Практические рекомендации по прогрессии для упражнения */
function suggestionFor(exerciseId, targetReps = '8-12', targetSets = 3) {
  const last = lastPerformance(exerciseId);
  const range = parseReps(targetReps);
  if (!last) {
    return { text: 'Первый раз: подберите вес, с которым техника остаётся чистой', weight: 0, reps: range.lo };
  }
  const bestSet = last.best;
  const w = bestSet.weight;
  const r = bestSet.reps;
  if (w <= 0) return { text: `В прошлый раз: ${r} повторов`, weight: 0, reps: range.hi };
  if (r >= range.hi) {
    const inc = w >= 40 ? 5 : w >= 15 ? 2.5 : 1;
    return {
      text: `Прошлый раз: ${fmtW(w)} × ${r}. Готовы к ${fmtW(w + inc)}?`,
      weight: w + inc,
      reps: range.lo,
      increase: inc,
    };
  }
  if (r < range.lo) {
    return {
      text: `Прошлый раз: ${fmtW(w)} × ${r}. Оставьте тот же вес и доберите повторения`,
      weight: w,
      reps: range.lo,
    };
  }
  return {
    text: `Прошлый раз: ${fmtW(w)} × ${r}. Цель — ${range.lo}–${range.hi} повторений`,
    weight: w,
    reps: Math.min(range.hi, r + 1),
  };
}

function fmtW(w) {
  return Number.isInteger(w) ? `${w} кг` : `${w} кг`;
}

function parseReps(reps) {
  const m = String(reps).match(/(\d+)\s*[-–]\s*(\d+)/);
  if (m) return { lo: num(m[1]), hi: num(m[2]) };
  const n = num(reps);
  return { lo: n || 10, hi: n || 10 };
}

/** Сколько раз упражнение встречается в программе */
function countInProgram(program, exerciseId) {
  return (program?.days || []).reduce(
    (acc, d) => acc + d.items.filter((i) => i.exerciseId === exerciseId).length,
    0
  );
}

function daysSinceLastWorkout() {
  const ws = finishedWorkouts();
  if (!ws.length) return null;
  return daysBetween(parseDate(ws[0].date || isoDate(ws[0].startedAt)), new Date());
}

/* ---------- нормализация и валидация ---------- */
function normalizeProgram(p) {
  const known = new Set(baseExercises().map((e) => e.id));
  const days = (p.days || []).map((d, i) => ({
    id: d.id || 'd' + i,
    name: d.name || `День ${i + 1}`,
    focus: d.focus || '',
    items: (d.items || [])
      .filter((it) => !it.exerciseId || known.has(it.exerciseId) || true)
      .map((it) => ({
        id: it.id || it.exerciseId,
        exerciseId: it.exerciseId || it.id,
        sets: Math.max(1, Number(it.sets) || 3),
        reps: String(it.reps || '8-12'),
        rest: Number.isFinite(Number(it.rest)) ? Number(it.rest) : 90,
        note: it.note || '',
        time: !!it.time,
      })),
  }));
  return {
    id: p.id,
    name: p.name,
    goal: p.goal || 'mass',
    level: p.level || 1,
    weeks: p.weeks || 8,
    color: p.color || '#c6f24a',
    icon: p.icon || 'layers',
    tagline: p.tagline || '',
    description: p.description || '',
    tips: p.tips || [],
    days,
    preset: !!p.preset,
    createdAt: p.createdAt || Date.now(),
  };
}

function presetPrograms() {
  return PRESET_RAW.map((p) => normalizeProgram({ ...p, preset: true }));
}

/* ===== js\timer.js ===== */
/* ============================================================
   Таймер отдыха: фон, звук, вибрация, уведомление, экран не гаснет
   ============================================================ */


const TKEY = 'atlet.timer.v1';

class RestTimer {
  constructor() {
    this.total = 90;
    this.remaining = 90;
    this.running = false;
    this.startedAt = 0;
    this.endsAt = 0;
    this.pausedLeft = 0;
    this.listeners = new Set();
    this._raf = null;
    this._lastShown = -1;
    this._done = false;
    this._audioCtx = null;
    this._wake = null;
  }

  on(fn) {
    this.listeners.add(fn);
    return () => this.listeners.delete(fn);
  }

  emit(type) {
    for (const fn of [...this.listeners]) {
      try {
        fn(type, this);
      } catch (e) {
        console.error(e);
      }
    }
  }

  start(seconds, opts = {}) {
    this.total = Math.max(5, Math.round(seconds));
    this.remaining = this.total;
    this.startedAt = Date.now();
    this.endsAt = this.startedAt + this.total * 1000;
    this.running = true;
    this._done = false;
    this._lastShown = -1;
    this.label = opts.label || '';
    if (opts.title) this.title = opts.title;
    this.save();
    this.requestWake();
    this.playStartCue();
    this.startLoop();
    this.emit('start');
    return this;
  }

  pause() {
    if (!this.running) return;
    this.running = false;
    this.pausedLeft = Math.max(0, (this.endsAt - Date.now()) / 1000);
    this.save();
    this.stopLoop();
    this.releaseWake();
    this.emit('pause');
  }

  resume() {
    if (this.running || this.remaining <= 0) return;
    this.endsAt = Date.now() + this.remaining * 1000;
    this.running = true;
    this._done = false;
    this.save();
    this.requestWake();
    this.startLoop();
    this.emit('resume');
  }

  add(seconds) {
    const next = Math.max(0, this.remaining + seconds);
    this.remaining = next;
    this.total = Math.max(this.total, next);
    if (this.running) {
      this.endsAt = Date.now() + next * 1000;
      if (next <= 0) this.finish();
    } else {
      this.pausedLeft = next;
    }
    this.save();
    this.emit('tick');
  }

  skip() {
    this.running = false;
    this.remaining = 0;
    this.stopLoop();
    this.releaseWake();
    this.clearSaved();
    this.emit('stop');
  }

  finish() {
    if (this._done) return;
    this._done = true;
    this.running = false;
    this.remaining = 0;
    this.stopLoop();
    this.save();
    this.releaseWake();
    this.alert();
    this.emit('finish');
    setTimeout(() => {
      if (!this.running) this.emit('idle');
    }, 2600);
  }

  restart() {
    this.start(this.total, { label: this.label, title: this.title });
  }

  startLoop() {
    this.stopLoop();
    this._raf = setInterval(() => this.tick(), 250);
    this.tick();
  }
  stopLoop() {
    if (this._raf) clearInterval(this._raf);
    this._raf = null;
  }

  tick() {
    if (!this.running) return;
    const left = Math.max(0, (this.endsAt - Date.now()) / 1000);
    this.remaining = left;
    if (left <= 0) {
      this.finish();
      return;
    }
    this.emit('tick');
  }

  get display() {
    return fmtDuration(Math.ceil(this.remaining));
  }

  /* ---------- звук ---------- */
  audioCtx() {
    if (!this._audioCtx) {
      const C = window.AudioContext || window.webkitAudioContext;
      if (!C) return null;
      try {
        this._audioCtx = new C();
      } catch {
        return null;
      }
    }
    if (this._audioCtx.state === 'suspended') this._audioCtx.resume().catch(() => {});
    return this._audioCtx;
  }

  beep(freq = 880, dur = 0.13, when = 0, vol = 0.16) {
    const ctx = this.audioCtx();
    if (!ctx) return;
    const t0 = ctx.currentTime + when;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
  }

  playStartCue() {
    if (!settings.sound) return;
    try {
      this.beep(660, 0.09, 0);
      this.beep(990, 0.09, 0.1);
    } catch {}
  }

  alert() {
    const s = settings;
    if (s.vibrate) {
      try {
        if (navigator.vibrate) navigator.vibrate([160, 90, 160, 90, 240]);
      } catch {}
    }
    haptic('heavy');
    if (s.sound) {
      try {
        this.beep(880, 0.14, 0);
        this.beep(880, 0.14, 0.2);
        this.beep(1320, 0.28, 0.4, 0.2);
      } catch {}
    }
    if (s.notify) {
      try {
        if ('Notification' in window && Notification.permission === 'granted' && document.hidden) {
          const n = new Notification('Отдых закончен 💪', {
            body: 'Пора делать следующий подход',
            tag: 'atlet-rest',
            silent: false,
          });
          n.onclick = () => window.focus();
        }
      } catch {}
    }
  }

  /* ---------- wake lock ---------- */
  async requestWake() {
    if (!settings.keepAwake) return;
    try {
      if ('wakeLock' in navigator && !this._wake) {
        this._wake = await navigator.wakeLock.request('screen');
        this._wake.addEventListener?.('release', () => {
          this._wake = null;
        });
      }
    } catch {}
  }
  releaseWake() {
    try {
      this._wake?.release?.();
    } catch {}
    this._wake = null;
  }

  /* ---------- сохранение ---------- */
  save() {
    try {
      localStorage.setItem(
        TKEY,
        JSON.stringify({
          total: this.total,
          running: this.running,
          endsAt: this.endsAt,
          paused: this.pausedLeft,
          label: this.label || '',
          title: this.title || '',
          at: Date.now(),
        })
      );
    } catch {}
  }
  clearSaved() {
    try {
      localStorage.removeItem(TKEY);
    } catch {}
  }
  restore() {
    try {
      const raw = localStorage.getItem(TKEY);
      if (!raw) return false;
      const d = JSON.parse(raw);
      this.total = d.total || 90;
      this.label = d.label || '';
      this.title = d.title || '';
      if (d.running && d.endsAt) {
        const left = (d.endsAt - Date.now()) / 1000;
        if (left > 0) {
          this.endsAt = d.endsAt;
          this.remaining = left;
          this.running = true;
          this.startLoop();
          this.requestWake();
          return true;
        }
      }
      // истёк в фоне — покажем «готово»
      if (d.running) {
        this.remaining = 0;
        this.running = false;
        this._done = true;
        this.emit('finish');
        return false;
      }
    } catch {}
    return false;
  }
}

/* доступ к настройкам без циклического импорта */
const settings = { sound: true, vibrate: true, notify: false, keepAwake: true, autoTimer: true };
function applySettings(s) {
  if (!s) return;
  settings.sound = s.sound !== false;
  settings.vibrate = s.vibrate !== false;
  settings.notify = !!s.notify;
  settings.keepAwake = s.keepAwake !== false;
  settings.autoTimer = s.autoTimer !== false;
}

const restTimer = new RestTimer();

/* при возврате на вкладку — пересчитываем */
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) {
    restTimer.tick();
    if (restTimer.running) restTimer.requestWake();
  }
});

/* ---------- приложение / роутер ---------- */
const ui = {
  view: 'today',
  tab: 'today',
  params: {},
  scrollY: 0,
  sessionMode: false,
};

const routes = new Map();
let renderCurrent = () => {};

function registerView(name, fn) {
  routes.set(name, fn);
}

function setRenderer(fn) {
  renderCurrent = fn;
}

function go(view, params = {}, opts = {}) {
  if (!routes.has(view)) {
    console.warn('Нет представления', view);
    return;
  }
  if (ui.view === 'session' && view !== 'session' && !opts.fromSession) {
    // не мешаем активной тренировке
  }
  ui.view = view;
  ui.params = params || {};
  ui.sessionMode = view === 'session';
  if (['today', 'programs', 'journal', 'progress', 'profile', 'exercises'].includes(view)) {
    if (view !== 'exercises') ui.tab = view;
  }
  document.getElementById('app').classList.toggle('is-session', ui.sessionMode);
  window.scrollTo({ top: 0, behavior: 'instant' });
  renderCurrent();
  updateTabbar();
}

function refresh() {
  renderCurrent();
  updateTabbar();
}

/* ---------- tabbar ---------- */
const TABS = [
  { id: 'today', label: 'Сегодня', icon: 'home' },
  { id: 'programs', label: 'Программы', icon: 'layers' },
  { id: 'journal', label: 'Журнал', icon: 'calendar' },
  { id: 'progress', label: 'Прогресс', icon: 'chart' },
  { id: 'profile', label: 'Профиль', icon: 'user' },
];

function mountTabbar(onNavigate) {
  const host = document.getElementById('app');
  const bar = h('nav', { class: 'tabbar', role: 'tablist' });
  for (const t of TABS) {
    const btn = h('button', {
      class: 'tabbar__item',
      'data-tab': t.id,
      role: 'tab',
      'aria-label': t.label,
      html: `${icon(t.icon, 24)}<span>${t.label}</span>`,
      onclick: () => {
        haptic();
        if (ui.view === 'session') {
          if (typeof onNavigate === 'function' && onNavigate('session')) return;
          return;
        }
        go(t.id);
      },
    });
    bar.append(btn);
  }
  document.body.append(bar);
  updateTabbar();
  return bar;
}

function updateTabbar() {
  const bar = $('.tabbar');
  if (!bar) return;
  bar.classList.toggle('hidden', ui.sessionMode);
  for (const btn of bar.querySelectorAll('.tabbar__item')) {
    btn.classList.toggle('is-active', btn.dataset.tab === ui.tab);
  }
}

/* ---------- chrome: верхняя панель ---------- */
function topbar({ title = '', sub = '', back = null, actions = '', cls = '' }) {
  return `<header class="top ${cls}">
    <div class="top__bar">
      ${back ? `<button class="top__back" data-action="${back}" aria-label="Назад">${icon('chevronLeft', 22)}</button>` : ''}
      <div class="grow">
        <h1 class="top__title">${title}${sub ? `<small>${sub}</small>` : ''}</h1>
      </div>
      ${actions ? `<div class="top__actions">${actions}</div>` : ''}
    </div>
  </header>`;
}

function emptyState({ iconName = 'sparkles', title, text, action = '' }) {
  return `<div class="empty">
    <div class="empty__icon">${icon(iconName, 26)}</div>
    <h3>${title}</h3>
    <p>${text}</p>
    ${action}
  </div>`;
}

/* ---------- действий-делегирование ---------- */
const actions = new Map();

function action(name, fn) {
  actions.set(name, fn);
}

function initActions() {
  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-action]');
    if (!el) return;
    const name = el.dataset.action;
    const fn = actions.get(name);
    if (!fn) return;
    e.preventDefault();
    e.stopPropagation();
    try {
      fn(el, e);
    } catch (err) {
      console.error('action', name, err);
      toast('Что-то пошло не так. Попробуйте ещё раз', 'danger');
    }
  });
}

function getAction(name) {
  return actions.get(name);
}

/* ---------- формы ---------- */
function formValues(root, scope = '') {
  const out = {};
  const q = scope ? `${scope} [data-field]` : '[data-field]';
  for (const el of root.querySelectorAll(q)) {
    const k = el.dataset.field;
    if (el.type === 'checkbox') out[k] = el.checked;
    else if (el.type === 'radio') {
      if (el.checked) out[k] = el.value;
    } else out[k] = el.value;
  }
  return out;
}

/* ---------- тосты ---------- */
function toast(text, kind = 'ok', ms = 2400) {
  const host = document.getElementById('toasts');
  const el = h('div', {
    class: `toast ${kind === 'danger' ? 'toast--danger' : ''}`,
    html: `${icon(kind === 'danger' ? 'alert' : kind === 'info' ? 'info' : 'check', 17)}<span>${escapeHtml(text)}</span>`,
  });
  host.append(el);
  setTimeout(() => {
    el.classList.add('is-out');
    setTimeout(() => el.remove(), 240);
  }, ms);
  while (host.children.length > 3) host.firstElementChild.remove();
}

/* ---------- оверлеи / шторки ---------- */
const overlayStack = [];

function overlayRoot() {
  return document.getElementById('overlays');
}

function sheet({ title = '', sub = '', body = '', foot = '', onClose = null, center = false, closeOnMask = true, id = '' }) {
  const root = overlayRoot();
  const wrap = h('div', { class: `sheet ${center ? 'sheet--center' : ''}`, id: id || undefined });
  wrap.innerHTML = `
    <div class="sheet__mask"></div>
    <div class="sheet__panel" role="dialog" aria-modal="true">
      ${center ? '' : '<div class="sheet__handle"></div>'}
      ${
        title
          ? `<div class="sheet__head">
              <div class="grow">
                <div class="sheet__title">${title}</div>
                ${sub ? `<div class="sheet__sub">${sub}</div>` : ''}
              </div>
              <button class="sheet__close" data-close aria-label="Закрыть">${icon('x', 18)}</button>
            </div>`
          : ''
      }
      <div class="sheet__body">${body}</div>
      ${foot ? `<div class="sheet__foot">${foot}</div>` : ''}
    </div>`;
  let closed = false;
  const close = (reason = 'close') => {
    if (closed) return;
    closed = true;
    const i = overlayStack.indexOf(entry);
    if (i >= 0) overlayStack.splice(i, 1);
    wrap.remove();
    if (!overlayStack.length) document.documentElement.classList.remove('has-sheet');
    onClose?.(reason);
  };
  wrap.querySelector('.sheet__mask').addEventListener('click', () => {
    if (closeOnMask) close('mask');
  });
  for (const el of wrap.querySelectorAll('[data-close]')) el.addEventListener('click', () => close('button'));
  root.append(wrap);
  const entry = { el: wrap, close };
  overlayStack.push(entry);
  document.documentElement.classList.add('has-sheet');
  return entry;
}

function closeSheets() {
  for (const s of [...overlayStack]) s.close('all');
}

function topSheet() {
  return overlayStack[overlayStack.length - 1] || null;
}

function confirmDialog({ title, text, ok = 'Удалить', cancel = 'Отмена', danger = true }) {
  return new Promise((resolve) => {
    let answered = false;
    const s = sheet({
      center: true,
      body: `<div class="dialog">
        <h3>${title}</h3>
        ${text ? `<p>${text}</p>` : ''}
        <div class="btn-row">
          <button class="btn btn--soft" data-answer="0">${cancel}</button>
          <button class="btn ${danger ? 'btn--danger' : 'btn--primary'}" data-answer="1">${ok}</button>
        </div>
      </div>`,
      onClose: () => {
        if (!answered) resolve(false);
      },
    });
    for (const btn of s.el.querySelectorAll('[data-answer]')) {
      btn.addEventListener('click', () => {
        answered = true;
        resolve(btn.dataset.answer === '1');
        s.close('answer');
      });
    }
  });
}

function promptDialog({ title, label = '', value = '', placeholder = '', ok = 'Сохранить', multiline = false, inputType = 'text' }) {
  return new Promise((resolve) => {
    let answered = false;
    const s = sheet({
      center: true,
      body: `<div class="dialog">
        <h3>${title}</h3>
        <div style="margin-top:16px">
          ${label ? `<div class="field__label" style="margin-bottom:6px">${label}</div>` : ''}
          ${
            multiline
              ? `<textarea class="textarea" data-pv placeholder="${placeholder}">${escapeHtml(value)}</textarea>`
              : `<input class="input" data-pv type="${inputType}" value="${escapeHtml(value)}" placeholder="${placeholder}" />`
          }
        </div>
        <div class="btn-row">
          <button class="btn btn--soft" data-cancel>Отмена</button>
          <button class="btn btn--primary" data-ok>${ok}</button>
        </div>
      </div>`,
      onClose: () => {
        if (!answered) resolve(null);
      },
    });
    const input = s.el.querySelector('[data-pv]');
    setTimeout(() => input?.focus(), 120);
    const submit = () => {
      answered = true;
      resolve(input.value.trim());
      s.close('answer');
    };
    s.el.querySelector('[data-ok]').addEventListener('click', submit);
    s.el.querySelector('[data-cancel]').addEventListener('click', () => {
      answered = true;
      resolve(null);
      s.close('cancel');
    });
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !multiline) submit();
    });
  });
}

/* ---------- сегменты-переключатели ---------- */
function segmented(items, value, actionName, attr = 'value') {
  return `<div class="segmented">${items
    .map(
      (it) =>
        `<button data-action="${actionName}" data-${attr}="${escapeHtml(it.id)}" class="${it.id === value ? 'is-on' : ''}">${escapeHtml(it.label)}</button>`
    )
    .join('')}</div>`;
}

/* ---------- аватар-инициалы ---------- */
function initials(name) {
  const t = (name || '').trim();
  if (!t) return 'А';
  return t
    .split(/\s+/)
    .slice(0, 2)
    .map((w) => w[0])
    .join('')
    .toUpperCase();
}

/* ---------- нижний «липкий» блок ---------- */
function stickyFoot(inner) {
  return `<div class="sticky-foot">${inner}</div>`;
}

/* ---------- форматирование дельт ---------- */
function deltaHtml(cur, prev, unit = '') {
  if (!prev) return '';
  const d = cur - prev;
  if (Math.abs(d) < 0.01) return `<span class="muted">${icon('equal', 12)}</span>`;
  const up = d > 0;
  return `<span class="delta ${up ? 'delta--up' : 'delta--down'}">${icon(up ? 'arrowUpRight' : 'arrowDownRight', 12)}${Math.abs(d) < 10 ? d.toFixed(1).replace('.0', '') : Math.round(Math.abs(d))}${unit}</span>`;
}

function activeSession() {
  const s = state.session;
  return s && s.workout && Array.isArray(s.workout.items) ? s : null;
}

function isActive() {
  return !!activeSession();
}

/* ---------- создание ---------- */
function newSet(weight = 0, reps = 10) {
  return { id: uid('s'), weight: num(weight), reps: num(reps), done: false };
}

function makeItem(exerciseId, sets = 3, reps = '8-12', rest = null, note = '') {
  const ex = exerciseById(exerciseId);
  const r = parseReps(reps);
  const isTime = !!ex?.time && ex.group === 'core';
  const setList = Array.from({ length: Math.max(1, sets) }, () =>
    isTime ? { id: uid('s'), weight: 0, reps: r.lo, done: false, duration: r.lo } : newSet(0, r.lo)
  );
  return {
    id: uid('it'),
    exerciseId,
    note: note || '',
    rest: rest ?? null,
    targetSets: Math.max(1, sets),
    targetReps: String(reps || '8-12'),
    sets: setList,
  };
}

function startSession({ name, programId = null, dayIndex = null, programDay = null, items = [], notes = '' } = {}) {
  const w = {
    id: uid('w'),
    name: name || 'Тренировка',
    programId,
    dayIndex,
    date: isoDate(new Date()),
    startedAt: Date.now(),
    finishedAt: null,
    notes,
    items: (items && items.length ? items : programDay ? dayToItems(programDay) : []).map((it) =>
      it.sets && it.sets[0] && typeof it.sets[0] === 'object'
        ? it
        : makeItem(it.exerciseId, it.sets || 3, it.reps || '8-12', it.rest, it.note)
    ),
  };
  if (w.items.length) w.items[0].collapsed = false;
  state.session = { workout: w, summary: null };
  save({ immediate: true });
  return state.session;
}

function dayToItems(day) {
  return (day?.items || []).map((it) => ({
    id: uid('it'),
    exerciseId: it.exerciseId,
    note: it.note || '',
    rest: it.rest ?? null,
    targetSets: it.sets || 3,
    targetReps: String(it.reps || '8-12'),
    sets: Array.from({ length: Math.max(1, it.sets || 3) }, () => {
      const ex = exerciseById(it.exerciseId);
      const r = parseReps(it.reps || '8-12');
      return ex?.time && ex.group === 'core'
        ? { id: uid('s'), weight: 0, reps: r.lo, done: false, duration: r.lo }
        : { id: uid('s'), weight: 0, reps: r.lo, done: false };
    }),
  }));
}

function startFromProgramDay(program, day, extra = {}) {
  const items = dayToItems(day);
  return startSession({
    name: extra.name || `${day.name}${day.focus ? ' · ' + day.focus : ''}`,
    programId: program.id,
    dayIndex: program.days.indexOf(day),
    items,
    notes: extra.notes || '',
  });
}

function startEmpty() {
  return startSession({ name: 'Свободная тренировка', items: [] });
}

function updateSession(mutator) {
  const s = activeSession();
  if (!s) return null;
  mutator(s.workout);
  s.workout.updatedAt = Date.now();
  save();
  return s.workout;
}

/* ---------- упражнения ---------- */
function addExercise(exerciseId, opts = {}) {
  const s = activeSession();
  if (!s) return null;
  const ex = exerciseById(exerciseId);
  if (!ex) return null;
  const item = makeItem(
    exerciseId,
    opts.sets || 3,
    opts.reps || (ex.group === 'core' ? '30-45' : ex.group === 'cardio' ? '20' : '8-12'),
    opts.rest,
    opts.note
  );
  if (opts.afterId) {
    const i = s.workout.items.findIndex((x) => x.id === opts.afterId);
    s.workout.items.splice(i >= 0 ? i + 1 : s.workout.items.length, 0, item);
  } else {
    s.workout.items.push(item);
  }
  s.workout.items.forEach((it, i) => (it.collapsed = i !== s.workout.items.indexOf(item) ? it.collapsed : false));
  save();
  return item;
}

function removeItem(itemId) {
  const s = activeSession();
  if (!s) return;
  s.workout.items = s.workout.items.filter((it) => it.id !== itemId);
  save();
}

function moveItem(itemId, dir) {
  const s = activeSession();
  if (!s) return;
  const items = s.workout.items;
  const i = items.findIndex((x) => x.id === itemId);
  const j = i + dir;
  if (i < 0 || j < 0 || j >= items.length) return;
  [items[i], items[j]] = [items[j], items[i]];
  save();
}

function replaceExercise(itemId, newExerciseId) {
  const s = activeSession();
  if (!s) return;
  const it = s.workout.items.find((x) => x.id === itemId);
  if (!it) return;
  const oldDone = it.sets.filter((x) => x.done).length;
  it.exerciseId = newExerciseId;
  it.sets = it.sets.map((x) => ({ ...x, done: false }));
  it.targetSets = Math.max(it.targetSets, oldDone || 3);
  save();
}

/* ---------- подходы ---------- */
function addSet(itemId, copyFrom = null) {
  const s = activeSession();
  if (!s) return;
  const it = s.workout.items.find((x) => x.id === itemId);
  if (!it) return;
  const last = copyFrom || it.sets[it.sets.length - 1];
  it.sets.push({
    id: uid('s'),
    weight: last ? num(last.weight) : 0,
    reps: last ? num(last.reps) : 10,
    duration: last?.duration || 0,
    distance: last?.distance || 0,
    done: false,
  });
  save();
}

function removeSet(itemId, setId) {
  const s = activeSession();
  if (!s) return;
  const it = s.workout.items.find((x) => x.id === itemId);
  if (!it || it.sets.length <= 1) return;
  it.sets = it.sets.filter((x) => x.id !== setId);
  save();
}

function updateSet(itemId, setId, patch) {
  const s = activeSession();
  if (!s) return;
  const it = s.workout.items.find((x) => x.id === itemId);
  const set = it?.sets.find((x) => x.id === setId);
  if (!set) return;
  Object.assign(set, patch);
  save();
}

/**
 * Отметить подход выполненным. Возвращает { item, set, nextItem, isPr }.
 */
function completeSet(itemId, setId, { startRest = true } = {}) {
  const s = activeSession();
  if (!s) return null;
  const it = s.workout.items.find((x) => x.id === itemId);
  if (!it) return null;
  const set = it.sets.find((x) => x.id === setId);
  if (!set) return null;

  const isPr = checkPr(it.exerciseId, set);
  set.done = true;
  set.completedAt = Date.now();
  haptic('heavy');
  save();

  let nextItem = null;
  let restStarted = false;
  if (startRest && settings.autoTimer) {
    const rest = it.rest || settings.restSec || 90;
    restTimer.start(rest, {
      label: exerciseById(it.exerciseId)?.name || '',
      title: `${it.sets.filter((x) => x.done).length} подход готов`,
    });
    restStarted = true;
  }
  if (it.sets.every((x) => x.done)) {
    // переходим к следующему упражнению
    const idx = s.workout.items.indexOf(it);
    nextItem = s.workout.items[idx + 1] || null;
  }
  return { item: it, set, nextItem, isPr, restStarted };
}

function uncompleteSet(itemId, setId) {
  const s = activeSession();
  if (!s) return;
  const it = s.workout.items.find((x) => x.id === itemId);
  const set = it?.sets.find((x) => x.id === setId);
  if (set) {
    set.done = false;
    haptic();
    save();
  }
}

/** Проверка личного рекорда (по 1ПМ среди завершённых тренировок) */
function checkPr(exerciseId, set) {
  const w = num(set.weight);
  const r = num(set.reps);
  if (w <= 0 || r <= 0) return false;
  const cur = e1rm(w, r);
  let best = 0;
  for (const wo of state.workouts || []) {
    for (const it of wo.items || []) {
      if (it.exerciseId !== exerciseId) continue;
      for (const st of it.sets || []) {
        if (!st.done) continue;
        best = Math.max(best, e1rm(num(st.weight), num(st.reps)));
      }
    }
  }
  // а также в этой сессии
  return cur > best + 0.01 && best > 0;
}

/* ---------- завершение ---------- */
function sessionStats(w) {
  const done = (w.items || []).flatMap((it) => it.sets.filter((s) => s.done));
  return {
    sets: done.length,
    volume: workoutVolume(w),
    duration: Math.max(1, Math.round(((w.finishedAt || Date.now()) - w.startedAt) / 1000)),
    exercises: (w.items || []).filter((it) => it.sets.some((s) => s.done)).length,
  };
}

function finishSession() {
  const s = activeSession();
  if (!s) return null;
  const w = s.workout;
  w.finishedAt = Date.now();
  w.date = isoDate(new Date(w.finishedAt ? w.finishedAt : Date.now()));
  // оставляем только выполненные подходы + пустые упражнения убираем
  w.items = w.items.filter((it) => it.sets.some((set) => set.done));
  for (const it of w.items) it.sets = it.sets.filter((set) => set.done);
  const hasAny = w.items.length > 0;
  if (hasAny) {
    state.workouts = [w, ...(state.workouts || []).filter((x) => x.id !== w.id)];
    if (w.programId) {
      state.activeProgramId = w.programId;
      state.programStart = state.programStart || Date.now();
    }
  }
  state.session = null;
  save({ immediate: true });
  restTimer.skip();
  return hasAny ? w : null;
}

function discardSession() {
  state.session = null;
  restTimer.skip();
  save({ immediate: true });
}

/* ---------- сессия из прошлой тренировки ---------- */
function repeatWorkout(workout, { sameDate = false } = {}) {
  const items = (workout.items || []).map((it) => ({
    id: uid('it'),
    exerciseId: it.exerciseId,
    note: it.note || '',
    rest: it.rest ?? null,
    targetSets: it.sets?.length || 3,
    targetReps: String(it.targetReps || it.sets?.[0]?.reps || '8-12'),
    sets: (it.sets || []).map((st) => ({
      id: uid('s'),
      weight: num(st.weight),
      reps: num(st.reps),
      done: false,
    })),
  }));
  return startSession({
    name: workout.name,
    programId: workout.programId || null,
    dayIndex: workout.dayIndex ?? null,
    items,
    notes: workout.notes || '',
  });
}

/** Скопировать прошлые подходы упражнения в текущую сессию */
function fillFromLast(itemId) {
  const s = activeSession();
  if (!s) return;
  const it = s.workout.items.find((x) => x.id === itemId);
  if (!it) return;
  // ищем последнюю тренировку с этим упражнением
  let sets = null;
  for (const w of state.workouts || []) {
    const found = (w.items || []).find((i) => i.exerciseId === it.exerciseId);
    if (found && found.sets?.length) {
      sets = found.sets;
      break;
    }
  }
  if (!sets) return false;
  it.sets = sets.map((st) => ({
    id: uid('s'),
    weight: num(st.weight),
    reps: num(st.reps),
    done: false,
  }));
  it.targetSets = sets.length;
  save();
  return true;
}

/* ---------- сессия: применение настроек таймера ---------- */
function syncTimerSettings() {
  applySettings(state.settings);
}

function goalRing(done, goal, size = 92) {
  const pct = Math.min(1, goal ? done / goal : 0);
  const r = size / 2 - 7;
  const c = 2 * Math.PI * r;
  return `<div class="ring" style="width:${size}px;height:${size}px">
    <svg class="ring__svg" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <circle class="ring__track" cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke-width="7"/>
      <circle class="ring__bar" cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke-width="7"
        stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - pct)}"/>
    </svg>
    <div class="ring__content">
      <div>

function chooseGroup({ title = 'Группа мышц', current = null } = {}) {
  return new Promise((resolve) => {
    let answered = false;
    const s = sheet({
      center: true,
      body: `<div class="dialog">
        <h3>${title}</h3>
        <div class="group-grid">
          ${GROUP_ORDER.map(
            (g) =>
              `<button class="group-pick ${current === g ? 'is-on' : ''}" data-group="${g}">
                <span class="group-pick__dot" style="background:${GROUPS[g].color}"></span>${GROUPS[g].label}
              </button>`
          ).join('')}
        </div>
        <button class="btn btn--ghost btn--block" style="margin-top:10px" data-cancel>Отмена</button>
      </div>`,
      onClose: () => {
        if (!answered) resolve(null);
      },
    });
    for (const b of s.el.querySelectorAll('[data-group]')) {
      b.addEventListener('click', () => {
        answered = true;
        resolve(b.dataset.group);
        s.close('pick');
      });
    }
    s.el.querySelector('[data-cancel]')?.addEventListener('click', () => {
      answered = true;
      resolve(null);
      s.close('cancel');
    });
  });
}

  return EQUIPMENT[eq]?.icon || 'dumbbell';
}

/**
 * openExercisePicker({ onPick, title, excludeIds })
 * onPick(exercise, sheetEntry)
 */
function openExercisePicker({ onPick, title = 'Выбрать упражнение', excludeIds = [], sub = '' } = {}) {
  let query = lastQuery;
  let group = lastGroup;

  const renderList = (sheetEl, bodyEl) => {
    const list = allExercises()
      .filter((e) => !excludeIds.includes(e.id))
      .filter((e) => group === 'all' || e.group === group)
      .filter((e) => !query || idxOf(e).includes(query))
      .sort((a, b) => score(b, query) - score(a, query) || a.name.localeCompare(b.name, 'ru'));

    const recentIds = recentExerciseIds().filter((id) => !excludeIds.includes(id));
    const recents = recentIds
      .map((id) => allExercises().find((e) => e.id === id))
      .filter(Boolean)
      .slice(0, 4);

    bodyEl.innerHTML = `
      <div class="picker-search">
        <div class="search">${icon('search', 18)}<input data-picker-search value="${escapeHtml(query)}" placeholder="Поиск упражнения…" autocomplete="off" spellcheck="false"><button class="search__clear ${query ? '' : 'hidden'}" data-picker-clear>${icon('x', 14)}</button></div>
      </div>
      <div class="chip-row picker-groups">
        <button class="chip ${group === 'all' ? 'is-on' : ''}" data-picker-group="all">Все</button>
        ${GROUP_ORDER.map((g) => `<button class="chip ${group === g ? 'is-on' : ''}" data-picker-group="${g}">${GROUPS[g].label}</button>`).join('')}
      </div>
      ${query || group !== 'all' ? '' : recents.length ? `<div class="picker-label">Недавние</div>${recents.map((ex) => exerciseRow(ex)).join('')}<div class="picker-label">Все упражнения</div>` : ''}
      <div class="pick-list">
        ${
          list.length
            ? list.map((ex) => exerciseRow(ex)).join('')
            : `<div class="empty" style="padding:26px 10px"><div class="empty__icon">${icon('search', 24)}</div><h3>Ничего не найдено</h3><p>Попробуйте другое название или создайте своё упражнение.</p>
               <button class="btn btn--accent-soft btn--sm" data-action="create-exercise" style="margin-top:6px">${icon('plus', 15)} Своё упражнение</button></div>`
        }
      </div>
      <button class="btn btn--soft btn--block" style="margin-top:10px" data-action="create-exercise">${icon('plus', 17)} Создать своё упражнение</button>
    `;
    const input = bodyEl.querySelector('[data-picker-search]');
    if (input) {
      input.addEventListener('input', () => {
        query = input.value.trim().toLowerCase();
        lastQuery = query;
        const pos = input.selectionStart;
        renderList(sheetEl, bodyEl);
        const ni = bodyEl.querySelector('[data-picker-search]');
        if (ni) {
          ni.focus();
          ni.setSelectionRange(pos, pos);
        }
      });
    }
    bodyEl.querySelector('[data-picker-clear]')?.addEventListener('click', () => {
      query = '';
      lastQuery = '';
      renderList(sheetEl, bodyEl);
    });
    for (const b of bodyEl.querySelectorAll('[data-picker-group]')) {
      b.addEventListener('click', () => {
        group = b.dataset.pickerGroup;
        lastGroup = group;
        haptic();
        renderList(sheetEl, bodyEl);
      });
    }
    for (const b of bodyEl.querySelectorAll('[data-action="pick-exercise"]')) {
      b.addEventListener('click', () => {
        const ex = allExercises().find((e) => e.id === b.dataset.id);
        if (!ex) return;
        haptic();
        current.close('pick');
        onPick?.(ex);
      });
    }
    for (const b of bodyEl.querySelectorAll('[data-action="create-exercise"]')) {
      b.addEventListener('click', () => {
        createCustomExercise({ excludeIds }).then((ex) => {
          if (!ex) return;
          current.close('pick');
          onPick?.(ex);
        });
      });
    }
  };

  const sh = sheet({
    title,
    sub,
    body: '<div data-picker-body></div>',
    onClose: () => {
      lastQuery = '';
    },
  });
  const current = sh;
  renderList(sh.el, sh.el.querySelector('[data-picker-body]'));
  setTimeout(() => sh.el.querySelector('[data-picker-search]')?.focus({ preventScroll: true }), 260);
  return sh;
}

function recentExerciseIds() {
  const ids = [];
  const seen = new Set();
  for (const w of (state.workouts || []).slice().sort((a, b) => b.startedAt - a.startedAt)) {
    for (const it of w.items || []) {
      if (!seen.has(it.exerciseId)) {
        seen.add(it.exerciseId);
        ids.push(it.exerciseId);
      }
      if (ids.length >= 8) return ids;
    }
  }
  return ids;
}

/* ---------- создание своего упражнения ---------- */
async function createCustomExercise({ excludeIds = [] } = {}) {
  const name = await promptDialog({
    title: 'Своё упражнение',
    label: 'Название',
    placeholder: 'Например: Тяга к поясу в наклоне',
    ok: 'Далее',
  });
  if (!name) return null;
  const group = await chooseGroup();
  if (!group) return null;
  const ex = {
    id: 'c-' + uid(),
    name: name.slice(0, 60),
    group,
    eq: 'other',
    level: 1,
    compound: false,
    cues: ['Своё упражнение — добавьте технику выполнения в описании.'],
    alts: [],
    time: group === 'core' || group === 'cardio',
    dist: group === 'cardio',
    custom: true,
  };
  state.customExercises = [...(state.customExercises || []), ex];
  save({ immediate: true });
  toast('Упражнение добавлено');
  return ex;
}

   Экран активной тренировки + таймер отдыха

let clockTimer = null;
let restUnsub = null;
let restSheetOpen = false;

function renderSession() {
  const s = activeSession();
  if (!s) return { html: '', mount() {} };
  syncTimerSettings();
  const w = s.workout;
  const done = w.items.reduce((a, it) => a + it.sets.filter((x) => x.done).length, 0);

    <div class="session-meta pad">
      <div class="row" style="gap:8px;flex-wrap:wrap">
        <span class="badge badge--accent" data-elapsed="${w.startedAt}">${fmtDuration((Date.now() - w.startedAt) / 1000)}</span>
        <button class="badge" data-action="session-date" style="border:0;color:inherit">${icon('calendar', 12)} ${fmtDate(w.date)}</button>

      </div>
    </div>

          ? w.items.map((it, i) => itemCard(it, i, w.items.length)).join('')

              <div class="empty__icon" style="margin:0 auto 10px">${icon('plusCircle', 26)}</div>
              <div class="h3">Пока пусто</div>
              <div class="muted" style="margin-top:4px">Добавьте первое упражнение, чтобы начать записывать подходы.</div>
            </div>`
      }
    </div>
    <div class="pad" style="margin-top:12px">
      <button class="btn btn--outline btn--block" data-action="add-exercise">${icon('plus', 18)} Добавить упражнение</button>
      <button class="btn btn--ghost btn--block" style="margin-top:8px" data-action="session-notes">${icon('note', 17)} Заметка к тренировке${w.notes ? ' · есть' : ''}</button>
    </div>
  `;

  return {
    html:
      topbar({
        title: w.name,
        sub: 'Активная тренировка',
        back: 'leave-session',

      }) + `<div class="view session-view">${body}</div>`,
    mount() {
      startClock();
      mountRestPill();
      bindSetInputs();
    },
  };
}

/* ---------- карточка упражнения ---------- */
function itemCard(it, idx, count) {
  const ex = exerciseById(it.exerciseId);
  const g = GROUPS[ex?.group] || GROUPS.chest;
  const last = lastPerformance(it.exerciseId);
  const doneCount = it.sets.filter((x) => x.done).length;
  const done = doneCount === it.sets.length;
  const collapsed = !!it.collapsed;
  const target = it.targetReps || '8-12';
  const timeBased = !!ex?.time && ex.group === 'core';
  const sportMode = ex?.group === 'sport';
  const wUnit = sportMode ? 'мин' : 'кг';
  const rUnit = sportMode ? 'мин' : timeBased ? 'сек' : 'повт';

  const lastMap = new Map();
  if (last) last.sets.forEach((st, i) => lastMap.set(i, st));

  const rows = it.sets
    .map((set, i) => {
      const prev = lastMap.get(i);
      const prevTxt = sportMode
        ? prev ? `${fmtNum(prev.duration || 60)} мин` : '—'
        : prev ? `${fmtNum(prev.weight)}×${fmtNum(prev.reps)}` : '—';
      const sugg = sportMode ? { weight: 0, reps: 60 } : suggestionFor(it.exerciseId, target, it.sets.length);
      const weightHint = sugg.weight || (prev && num(prev.weight));
      const placeholder = done ? '' : sportMode ? 'placeholder="60"' : weightHint ? `placeholder="${fmtNum(weightHint)}"` : 'placeholder="—"';
      const wValue = sportMode ? (set.duration ? fmtNum(set.duration) : '') : (set.weight ? fmtNum(set.weight) : '');
      const rValue = sportMode ? (set.distance ? fmtNum(set.distance) : '') : (set.reps ? fmtNum(set.reps) : '');
      return `<div class="setrow ${set.done ? 'is-done' : ''}" data-item="${it.id}" data-set="${set.id}">
        <div class="setrow__n">${i + 1}</div>
        <div class="setrow__prev" data-prev="${set.id}" title="Прошлый раз">${prevTxt}</div>
        <div class="setrow__field">
          <input class="setin" type="number" inputmode="decimal" step="${sportMode ? 1 : 0.5}" min="0"
            data-field-${sportMode ? 'duration' : 'weight'} data-item="${it.id}" data-set="${set.id}"
            value="${wValue}" ${placeholder}
            aria-label="${sportMode ? 'Минуты' : 'Вес'}" ${set.done ? 'readonly' : ''}>
        </div>
        <div class="setrow__field">
          <input class="setin" type="number" inputmode="numeric" step="${sportMode ? 0.1 : 1}" min="0"
            data-field-${sportMode ? 'distance' : 'reps'} data-item="${it.id}" data-set="${set.id}"
            value="${rValue}"
            aria-label="${sportMode ? 'Дистанция, км' : timeBased ? 'Секунды' : 'Повторения'}" ${set.done ? 'readonly' : ''}>
        </div>
        <button class="setrow__check ${set.done ? 'is-on' : ''}" data-action="toggle-set"
          data-item="${it.id}" data-set="${set.id}" aria-label="${set.done ? 'Отменить подход' : 'Выполнить подход'}">
          ${icon('check', 18)}
        </button>
      </div>`;
    })
    .join('');

  const volume = it.sets.reduce((a, st) => a + (st.done ? num(st.weight) * num(st.reps) : 0), 0);

  return `<div class="ex-card ${done ? 'is-complete' : ''} ${collapsed ? 'is-collapsed' : ''}" data-item-card="${it.id}">
    <div class="ex-head" data-action="toggle-collapse" data-item="${it.id}">
      <div class="ex-idx" style="background:${g.color}22;color:${g.color}">${done ? icon('check', 16) : idx + 1}</div>
      <div class="grow">
        <div class="ex-name">${escape(ex?.name || 'Упражнение')}</div>
        <div class="ex-sub">${g.label} · цель ${it.sets.length}×${target}${ex?.time && ex.group === 'core' ? ' сек' : ''}</div>
      </div>
      <div class="ex-head__right">
        ${done ? (volume > 0 ? `<span class="badge badge--accent">${fmtVolume(volume)}</span>` : `<span class="badge badge--accent">${icon('check', 12)}</span>`) : `<span class="badge">${doneCount}/${it.sets.length}</span>`}
        <span class="ex-caret">${icon(collapsed ? 'chevronRight' : 'chevronDown', 18)}</span>
      </div>
    </div>
    ${
      collapsed
        ? ''
        : `<div class="ex-body">
      ${
        last
          ? `<div class="ex-prev">${icon('history', 13)} <span>Прошлый раз ${fmtDate(last.date)}: ${sportMode
              ? last.sets.map((x) => `${fmtNum(x.duration || 60)} мин`).join(', ')
              : last.sets.map((x) => `${fmtNum(x.weight)}×${fmtNum(x.reps)}`).join(', ')}</span></div>`
          : `<div class="ex-prev">${icon('info', 13)} <span>Новое упражнение — запишите свой первый подход</span></div>`
      }
      <div class="setrow setrow--head">
        <div class="setrow__n">#</div>
        <div class="setrow__prev">Прошлый</div>
        <div class="setrow__field">${wUnit}</div>
        <div class="setrow__field">${rUnit}</div>
        <div style="width:38px"></div>
      </div>
      ${rows}
      <div class="ex-actions">
        ${sportMode ? '' : `<button class="chip" data-action="add-set" data-item="${it.id}">${icon('plus', 14)} Подход</button>`}
        <button class="chip" data-action="fill-last" data-item="${it.id}">${icon('copy', 14)} Из прошлой</button>
        <button class="chip" data-action="swap-exercise" data-item="${it.id}">${icon('switch', 14)} Заменить</button>
        <button class="chip" data-action="item-menu" data-item="${it.id}">${icon('dots', 14)}</button>
      </div>
    </div>`
    }
  </div>`;
}

/* ---------- ввод значений подхода ---------- */
function bindSetInputs() {
  const handler = (e) => {
    const el = e.target;
    if (!el.classList || !el.classList.contains('setin')) return;
    const itemId = el.dataset.item;
    const setId = el.dataset.set;
    if (!itemId || !setId) return;
    const patch = {};
    if ('fieldWeight' in el.dataset) patch.weight = num(el.value);
    else if ('fieldReps' in el.dataset) patch.reps = num(el.value);
    else if ('fieldDuration' in el.dataset) patch.duration = num(el.value);
    else if ('fieldDistance' in el.dataset) patch.distance = num(el.value);
    if (Object.keys(patch).length) {
      try {
        updateSet(itemId, setId, patch);
      } catch (err) {
        console.error('set input', err);
      }
    }
  };
  document.addEventListener('input', handler, { passive: true });
  document.addEventListener('change', handler, { passive: true });
}

function fmtNum(v) {
  const n = num(v);
  if (!n && n !== 0) return '';
  return Number.isInteger(n) ? String(n) : String(n);
}

function escape(s) {
  return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

/* ---------- часы ---------- */
function startClock() {
  stopClock();
  clockTimer = setInterval(() => {
    const s = activeSession();
    if (!s) return stopClock();
    for (const el of document.querySelectorAll('[data-elapsed]')) {
      const t = Number(el.dataset.elapsed);
      el.textContent = fmtDuration((Date.now() - t) / 1000);
    }
  }, 1000);
}
function stopClock() {
  if (clockTimer) clearInterval(clockTimer);
  clockTimer = null;
}

/* ---------- плавающая плашка таймера ---------- */
function renderRestPill() {
  const host = document.getElementById('app');
  if (!host) return;
  const t = restTimer;
  const visible = t.running || (t.remaining > 0 && !t.running);
  let pill = host.querySelector('.rest-pill');
  if (!visible) {
    pill?.remove();
    return;
  }
  if (!pill) {
    pill = document.createElement('button');
    pill.className = 'rest-pill';
    pill.dataset.action = 'open-rest';
    pill.innerHTML = `<span class="rest-pill__dot"></span><span class="rest-pill__time num"></span><span class="rest-pill__x" data-action="skip-rest">${icon('x', 14)}</span>`;
    host.append(pill);
  }
  pill.querySelector('.rest-pill__time').textContent = t.display;
  pill.classList.toggle('is-paused', !t.running);
  pill.classList.toggle('is-warn', t.remaining <= 10 && t.running);
}

/* ---------- пилюля таймера ---------- */
function mountRestPill() {
  restUnsub?.();
  restUnsub = restTimer.on((type, t) => {
    renderRestPill();
    if (restSheetOpen) updateRestSheet(t);
    if (type === 'finish') {
      document.documentElement.classList.add('timer-alert');
      setTimeout(() => document.documentElement.classList.remove('timer-alert'), 3000);
      haptic('heavy');
    }
    if (type === 'finish' || type === 'stop') {
      restSheetClose();
      document.documentElement.classList.remove('timer-alert');
      renderRestPill();
    }
  });
  renderRestPill();
}

/* ---------- шторка таймера ---------- */
let restSheet = null;

function openRestSheet(seconds = null) {
  const t = restTimer;
  if (seconds && !t.running) t.start(seconds);
  if (!t.running && t.remaining <= 0) t.start(settings.restSec || 90);
  restSheetOpen = true;
  restSheet = sheet({
    id: 'rest-sheet',
    body: `<div class="rest-close-row"><button class="rest-collapse" data-close>${icon('chevronDown', 20)} Свернуть таймер</button></div>
      <div class="rest__body">${restSheetBody(t)}</div>`,
    onClose: () => {
      restSheetOpen = false;
      restSheet = null;
    },
  });
  updateRestSheet(t);
  renderRestPill();
  return restSheet;
}
function restSheetClose() {
  if (restSheet) {
    const r = restSheet;
    restSheet = null;
    restSheetOpen = false;
    r.close('timer');
  }
}

function restSheetBody(t) {
  const total = Math.max(1, t.total || settings.restSec || 90);
  const pct = Math.max(0, Math.min(1, t.remaining / total));
  const R = 62;
  const C = 2 * Math.PI * R;
  return `<div class="rest">
    <div class="rest__ring">
      <div class="ring" style="width:180px;height:180px">
        <svg class="ring__svg" width="180" height="180" viewBox="0 0 180 180">
          <circle class="ring__track" cx="90" cy="90" r="${R}" fill="none" stroke-width="9"/>
          <circle class="ring__bar" id="rest-ring" cx="90" cy="90" r="${R}" fill="none" stroke-width="9"
            stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - pct)}"/>
        </svg>
        <div class="ring__content">
          <div>
            <div class="ring__time" id="rest-time" style="font-size:42px">${t.display}</div>
            <div class="ring__label" id="rest-label">${t.running ? 'отдых' : t.remaining > 0 ? 'пауза' : 'готово'}</div>
          </div>
        </div>
      </div>
    </div>
    <div class="rest__title">${t.running ? 'Отдыхайте' : t.remaining > 0 ? 'Пауза' : 'Время работать!'}</div>
    <div class="rest__sub" id="rest-sub">${t.label ? escape(t.label) : 'Отдых между подходами'}</div>
    <div class="rest__presets">
      ${[45, 60, 90, 120, 180].map((p) => `<button class="chip ${p === total ? 'is-on' : ''}" data-action="rest-set" data-sec="${p}">${p >= 60 ? (p % 60 === 0 ? p / 60 + ' мин' : Math.floor(p / 60) + ':30') : p + 'с'}</button>`).join('')}
    </div>
    <div class="rest__controls">
      <button class="rest__btn" data-action="rest-minus">${icon('minus', 20)}<span>15</span></button>
      <button class="rest__btn rest__btn--big" data-action="rest-toggle">${icon(t.running ? 'pause' : 'play', 30)}</button>
      <button class="rest__btn" data-action="rest-plus">${icon('plus', 20)}<span>15</span></button>
    </div>
    <button class="btn btn--soft btn--block" style="margin-top:16px" data-action="skip-rest">Пропустить отдых</button>
  </div>`;
}

function updateRestSheet(t) {
  const timeEl = document.getElementById('rest-time');
  if (!timeEl) return;
  timeEl.textContent = t.display;
  const total = Math.max(1, t.total || 90);
  const pct = Math.max(0, Math.min(1, t.remaining / total));
  const R = 62;
  const C = 2 * Math.PI * R;
  const ring = document.getElementById('rest-ring');
  if (ring) {
    ring.style.strokeDashoffset = String(C * (1 - pct));
    ring.style.stroke = t.remaining <= 10 ? 'var(--warn)' : 'var(--accent)';
  }
  const lbl = document.getElementById('rest-label');
  if (lbl) lbl.textContent = t.running ? 'отдых' : t.remaining > 0 ? 'пауза' : 'готово';
  const title = document.querySelector('.rest__title');
  if (title) title.textContent = t.running ? 'Отдыхайте' : t.remaining > 0 ? 'Пауза' : 'Время работать!';
  const toggle = document.querySelector('[data-action="rest-toggle"]');
  if (toggle) toggle.innerHTML = icon(t.running ? 'pause' : 'play', 30);
}

function openRestSheetDirect() {
  openRestSheet(null);
}

/* ---------- завершение ---------- */
async function requestFinish() {
  const s = activeSession();
  if (!s) return;
  const st = sessionStats(s.workout);
  if (!st.sets) {
    const ok = await confirmDialog({
      title: 'Ни одного подхода',
      text: 'Вы ещё не отметили ни одного подхода. Выйти без сохранения?',
      ok: 'Выйти',
      cancel: 'Продолжить',
    });
    if (ok) {
      discardSession();
      closeSheets();
      refresh();
    }
    return;
  }
  const w = finishSession();
  closeSheets();
  if (w) {
    toast('Тренировка сохранена 💪');
    try {
      showWorkoutSummary(w);
    } catch (e) {
      console.error(e);
    }
  }
  refresh();
}

let monthCursor = new Date();
let expandedCal = false;

function renderJournal() {
  const all = finishedWorkouts();
  const byMonth = new Map();
  for (const w of all) {
    const ym = (w.date || isoDate(w.startedAt)).slice(0, 7);
    if (!byMonth.has(ym)) byMonth.set(ym, []);
    byMonth.get(ym).push(w);
  }

  const body = `
    <div class="pad" style="margin-top:4px">
      ${calendar(all)}
    </div>
    <div class="section-title"><h2>История</h2><span class="muted">${all.length} ${plural(all.length, 'тренировка', 'тренировки', 'тренировок')}</span></div>
    <div class="pad">
      ${
        all.length
          ? [...byMonth.entries()]
              .map(
                ([ym, ws]) => `<div class="month-block">
            <div class="month-title">${monthLabel(ym)} <span class="muted">· ${ws.length}</span></div>
            <div class="card list">
              ${ws.map(journalRow).join('')}
            </div>
          </div>`
              )
              .join('')
          : emptyState({
              iconName: 'calendar',
              title: 'Журнал пуст',
              text: 'Завершённые тренировки появятся здесь: объём, время, группы мышц и лучшие подходы.',
              action: `<button class="btn btn--primary btn--sm" data-action="start-blank">${icon('play', 15)} Начать тренировку</button>
                <button class="btn btn--soft btn--sm" data-action="import-history" style="margin-top:2px">${icon('upload', 15)} Импортировать историю</button>`,
            })
      }
    </div>`;

  return {
    html:
      topbar({
        title: 'Журнал',
        sub: `${all.length} ${plural(all.length, 'запись', 'записи', 'записей')}`,
        actions: `<button class="btn btn--icon btn--soft" data-action="start-blank" aria-label="Новая тренировка">${icon('plus', 20)}</button>`,
      }) + `<div class="view">${body}</div>`,
    mount() {
      for (const b of document.querySelectorAll('[data-cal-nav]')) {
        b.addEventListener('click', () => {
          const dir = Number(b.dataset.calNav);
          monthCursor = new Date(monthCursor.getFullYear(), monthCursor.getMonth() + dir, 1);
          haptic();
          refresh();
        });
      }
      document.querySelector('[data-cal-toggle]')?.addEventListener('click', () => {
        expandedCal = !expandedCal;
        refresh();
      });
      for (const b of document.querySelectorAll('[data-cal-jump]')) {
        b.addEventListener('click', () => {
          const [y, m] = b.dataset.calJump.split('-').map(Number);
          monthCursor = new Date(y, m - 1, 1);
          haptic();
          refresh();
        });
      }
      for (const b of document.querySelectorAll('[data-cal-day]')) {
        b.addEventListener('click', () => {
          const d = b.dataset.calDay;
          const ws = finishedWorkouts().filter((w) => (w.date || isoDate(w.startedAt)) === d);
          if (!ws.length) return;
          if (ws.length === 1) go('workout', { id: ws[0].id });
          else openDaySheet(d, ws);
        });
      }
    },
  };
}

function calendar(all) {
  const first = new Date(monthCursor.getFullYear(), monthCursor.getMonth(), 1);
  const last = new Date(monthCursor.getFullYear(), monthCursor.getMonth() + 1, 0);
  const startOffset = (first.getDay() + 6) % 7;
  const days = [];
  for (let i = 0; i < startOffset; i++) days.push(null);
  for (let d = 1; d <= last.getDate(); d++) days.push(new Date(monthCursor.getFullYear(), monthCursor.getMonth(), d));

  const trainedDays = new Map();
  for (const w of all) {
    const d = w.date || isoDate(w.startedAt);
    const cur = trainedDays.get(d) || { count: 0, vol: 0 };
    cur.count++;
    cur.vol += workoutVolume(w);
    trainedDays.set(d, cur);
  }

  const todayIso = isoDate(new Date());
  const weeks = Math.ceil(days.length / 7);
  const maxVol = Math.max(1, ...[...trainedDays.values()].map((v) => v.vol));
  const rows = [];
  const limitWeeks = expandedCal ? weeks : 5;
  const shownDays = days.slice(0, limitWeeks * 7);

  const monthKeys = [...new Set(all.map((w) => (w.date || isoDate(w.startedAt)).slice(0, 7)))].sort().reverse();
  const monthCount = new Map();
  for (const w of all) {
    const k = (w.date || isoDate(w.startedAt)).slice(0, 7);
    monthCount.set(k, (monthCount.get(k) || 0) + 1);
  }
  const curKey = isoDate(monthCursor).slice(0, 7);
  const isCurrentMonth = curKey === isoDate(new Date()).slice(0, 7);

  return `<div class="card cal">
    <div class="cal__head">
      <button class="cal__nav" data-cal-nav="-1" aria-label="Предыдущий месяц">${icon('chevronLeft', 18)}</button>
      <div class="cal__month">${monthLabel(curKey)}</div>
      <button class="cal__nav" data-cal-nav="1" aria-label="Следующий месяц">${icon('chevronRight', 18)}</button>
    </div>
    ${
      monthKeys.length > 1
        ? `<div class="cal__months">
            ${isCurrentMonth ? '' : `<button class="cal__jump" data-cal-jump="${new Date().getFullYear()}-${String(new Date().getMonth() + 1).padStart(2, '0')}">Сегодня</button>`}
            ${monthKeys.map((k) => `<button class="cal__month-chip ${k === curKey ? 'is-on' : ''}" data-cal-jump="${k}">
              ${monthShort(k)} <span class="cal__month-n">${monthCount.get(k)}</span>
            </button>`).join('')}
          </div>`
        : ''
    }
    <div class="cal__weekdays">${['пн', 'вт', 'ср', 'чт', 'пт', 'сб', 'вс'].map((d) => `<span>${d}</span>`).join('')}</div>
    <div class="cal__grid">
      ${shownDays
        .map((d) => {
          if (!d) return '<span class="cal__cell cal__cell--empty"></span>';
          const iso = isoDate(d);
          const tr = trainedDays.get(iso);
          const isToday = iso === todayIso;
          const future = iso > todayIso;
          const level = tr ? Math.max(0.3, Math.min(1, tr.vol / maxVol)) : 0;
          return `<button class="cal__cell ${isToday ? 'is-today' : ''} ${tr ? 'has-workout' : ''} ${future ? 'is-future' : ''}"
            data-cal-day="${iso}" ${tr ? '' : 'disabled'}
            aria-label="${fmtDate(d)}${tr ? ', тренировка' : ''}"
            style="${tr ? '--lvl:' + level.toFixed(2) : ''}">
            ${d.getDate()}
          </button>`;
        })
        .join('')}
    </div>
    ${
      weeks > 5
        ? `<button class="cal__more" data-cal-toggle>${expandedCal ? 'Свернуть' : 'Показать все дни'} ${icon(expandedCal ? 'chevronUp' : 'chevronDown', 15)}</button>`
        : ''
    }
    <div class="cal__foot">
      ${trainedDays.size ? `В этом месяце: ${[...trainedDays.keys()].filter((k) => k.startsWith(curKey)).length} из ${all.length} тренировок` : `В этом месяце тренировок нет — переключите месяц выше`}
    </div>
  </div>`;


  return `<div class="card cal">
    <div class="cal__head">
      <button class="cal__nav" data-cal-nav="-1">${icon('chevronLeft', 18)}</button>
      <div class="cal__month">${monthLabel(isoDate(first).slice(0, 7))}</div>
      <button class="cal__nav" data-cal-nav="1">${icon('chevronRight', 18)}</button>
    </div>
    <div class="cal__weekdays">${['пн', 'вт', 'ср', 'чт', 'пт', 'сб', 'вс'].map((d) => `<span>${d}</span>`).join('')}</div>
    <div class="cal__grid">
      ${shownDays
        .map((d) => {
          if (!d) return '<span class="cal__cell cal__cell--empty"></span>';
          const iso = isoDate(d);
          const tr = trainedDays.get(iso);
          const isToday = iso === todayIso;
          const future = iso > todayIso;
          const level = tr ? Math.max(0.25, Math.min(1, tr.vol / maxVol)) : 0;
          return `<button class="cal__cell ${isToday ? 'is-today' : ''} ${tr ? 'has-workout' : ''} ${future ? 'is-future' : ''}"
            data-cal-day="${iso}" ${tr ? '' : 'disabled'}
            style="${tr ? `--lvl:${level.toFixed(2)}` : ''}">

        ? `<button class="cal__more" data-cal-toggle>${expandedCal ? 'Свернуть' : 'Показать все дни'} ${icon(expandedCal ? 'chevronUp' : 'chevronDown', 15)}</button>`
        : ''
    }
  </div>`;
}

function monthShort(ym) {
  const [y, m] = ym.split('-').map(Number);
  const names = ['янв', 'фев', 'мар', 'апр', 'май', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
  return names[m - 1] + ' ' + String(y).slice(2);
}

function journalRow(w) {
  const groups = workoutGroups(w);
  const main = groups[0];
  const g = GROUPS[main?.group] || GROUPS.chest;
  return `<button class="list__row" data-action="open-workout" data-id="${w.id}">
    <span class="list__icon" style="background:${g.color}1a;color:${g.color}">${icon('dumbbell', 17)}</span>
    <span class="grow" style="min-width:0">
      <span class="list__label ellipsis" style="display:block">${escapeHtml(w.name)}</span>
      <span class="list__sub ellipsis" style="display:block">${weekdayShort(w.date)}, ${fmtDate(w.date)} · ${workoutSets(w)} подх. · ${fmtVolume(workoutVolume(w))}</span>
    </span>
    ${icon('chevronRight', 18, 'list__chev')}

}

function openDaySheet(iso, ws) {
  sheet({
    title: fmtDate(parseDate(iso)),
    sub: `${ws.length} тренировки`,
    body: `<div class="card list">${ws
      .map((w) => `<button class="list__row" data-action="open-workout" data-id="${w.id}"><span class="list__icon">${icon('dumbbell', 17)}</span><span class="grow"><span class="list__label" style="display:block">${escapeHtml(w.name)}</span><span class="list__sub">${fmtVolume(workoutVolume(w))} · ${workoutSets(w)} подходов</span></span>${icon('chevronRight', 18, 'list__chev')}</button>`)
